<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 800" role="img" aria-labelledby="title desc">
  <title id="title">Hình 1.72. Bốn Linh Thú Thiên Giới và các quyền năng của chúng</title>
  <desc id="desc">Sơ đồ Bốn Linh Thú quanh tâm: Phượng Hoàn Lửa (Ý Định) ở Nam, Hổ Đất (Cảm Giác) ở Tây, Rùa/Rắn Nước (Chú Ý) ở Bắc, Rồng Trời (Tưởng Tượng) ở Đông. Toàn bộ nhãn bằng tiếng Việt.</desc>
  <rect width="1100" height="800" fill="#ffffff"/>
  <g font-family="Be Vietnam, Noto Sans, Arial, sans-serif" fill="#111111" stroke="none">
    <circle cx="550" cy="400" r="155" fill="#ffffff" stroke="#111111" stroke-width="2.4"/>
    <rect x="425" y="110" width="250" height="120" fill="#ffffff" stroke="#111111" stroke-width="1.8"/>
    <text x="550" y="137" font-size="18" font-weight="700" text-anchor="middle">
<tspan x="550" dy="0">Phượng Hoàn Lửa</tspan>
</text>
    <text x="550" y="162" font-size="15" font-weight="400" text-anchor="middle">
<tspan x="550" dy="0">(Ý Định)</tspan>
</text>
    <text x="550" y="188" font-size="15" font-weight="400" text-anchor="middle">
<tspan x="550" dy="0">Thần (Sương Đỏ)</tspan>
</text>
    <text x="550" y="213" font-size="15" font-weight="400" text-anchor="middle">
<tspan x="550" dy="0">Dương Khí (Nam)</tspan>
</text>
    <rect x="795" y="340" width="250" height="120" fill="#ffffff" stroke="#111111" stroke-width="1.8"/>
    <text x="920" y="367" font-size="18" font-weight="700" text-anchor="middle">
<tspan x="920" dy="0">Hổ Đất</tspan>
</text>
    <text x="920" y="392" font-size="15" font-weight="400" text-anchor="middle">
<tspan x="920" dy="0">(Cảm Giác)</tspan>
</text>
    <text x="920" y="418" font-size="15" font-weight="400" text-anchor="middle">
<tspan x="920" dy="0">Phách (Sương Trắng)</tspan>
</text>
    <text x="920" y="443" font-size="15" font-weight="400" text-anchor="middle">
<tspan x="920" dy="0">Âm Khí (Tây)</tspan>
</text>
    <rect x="425" y="570" width="250" height="120" fill="#ffffff" stroke="#111111" stroke-width="1.8"/>
    <text x="550" y="597" font-size="18" font-weight="700" text-anchor="middle">
<tspan x="550" dy="0">Rùa/Rắn Nước</tspan>
</text>
    <text x="550" y="622" font-size="15" font-weight="400" text-anchor="middle">
<tspan x="550" dy="0">(Chú Ý)</tspan>
</text>
    <text x="550" y="648" font-size="15" font-weight="400" text-anchor="middle">
<tspan x="550" dy="0">Trí (Sương Đen)</tspan>
</text>
    <text x="550" y="673" font-size="15" font-weight="400" text-anchor="middle">
<tspan x="550" dy="0">Âm Khí (Bắc)</tspan>
</text>
    <rect x="55" y="340" width="250" height="120" fill="#ffffff" stroke="#111111" stroke-width="1.8"/>
    <text x="180" y="367" font-size="18" font-weight="700" text-anchor="middle">
<tspan x="180" dy="0">Rồng Trời</tspan>
</text>
    <text x="180" y="392" font-size="15" font-weight="400" text-anchor="middle">
<tspan x="180" dy="0">(Tưởng Tượng)</tspan>
</text>
    <text x="180" y="418" font-size="15" font-weight="400" text-anchor="middle">
<tspan x="180" dy="0">Hồn (Sương Xanh)</tspan>
</text>
    <text x="180" y="443" font-size="15" font-weight="400" text-anchor="middle">
<tspan x="180" dy="0">Dương Khí (Đông)</tspan>
</text>
    <circle cx="550" cy="315" r="28" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
    <text x="550" y="320" font-size="14" font-weight="700" text-anchor="middle">
<tspan x="550" dy="0">Ph</tspan>
</text>
    <circle cx="640" cy="400" r="28" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
    <text x="640" y="405" font-size="14" font-weight="700" text-anchor="middle">
<tspan x="640" dy="0">Hổ</tspan>
</text>
    <circle cx="550" cy="485" r="28" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
    <text x="550" y="490" font-size="14" font-weight="700" text-anchor="middle">
<tspan x="550" dy="0">Rù</tspan>
</text>
    <circle cx="460" cy="400" r="28" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
    <text x="460" y="405" font-size="14" font-weight="700" text-anchor="middle">
<tspan x="460" dy="0">Rồ</tspan>
</text>
  </g>
</svg>
