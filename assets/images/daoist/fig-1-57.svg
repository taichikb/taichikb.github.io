<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1700" role="img" aria-labelledby="title desc">
  <title id="title">Hình 1.57. Sự hiểu biết của Đạo gia cổ đại về 3 tư thế, 3 hơi thở và 3 tâm</title>
  <desc id="desc">Sơ đồ ba cấp độ Tâm, ba cấp độ Hơi Thở và ba cấp độ Thân Thể theo Đạo gia cổ đại, mỗi cấp gồm Physical, Energetic, Spiritual kèm giải thích. Toàn bộ nhãn bằng tiếng Việt.</desc>
  <rect width="1500" height="1700" fill="#ffffff"/>
  <g font-family="Be Vietnam, Noto Sans, Arial, sans-serif" fill="#111111" stroke="none">
    <rect x="50" y="210" width="230" height="140" fill="#ffffff" stroke="#111111" stroke-width="2"/>    <text x="65" y="260" font-size="20" font-weight="700" text-anchor="start">
<tspan x="65" dy="0">BA CẤP ĐỘ CỦA TÂM</tspan>
</text>    <line x1="280" y1="280" x2="330" y2="120" stroke="#111111" stroke-width="1.6"/>    <rect x="330" y="60" width="250" height="110" fill="#ffffff" stroke="#111111" stroke-width="1.6"/>
    <text x="342" y="94" font-size="18" font-weight="700" text-anchor="start">
<tspan x="342" dy="0">3. Tâm Tâm Linh</tspan>
</text>    <line x1="580" y1="115" x2="610" y2="115" stroke="#111111" stroke-width="1.6"/>    <rect x="610" y="60" width="840" height="150" fill="#ffffff" stroke="#111111" stroke-width="1.6"/>
    <text x="622" y="86" font-size="16" font-weight="400" text-anchor="start">
</text>
    <text x="622" y="118" font-size="14" font-weight="400" text-anchor="start">
<tspan x="622" dy="0">Tâm Siêu Ý Thức Sáng Tạo: chịu trách nhiệm về những hiểu biết và nhận thức tâm linh "biết mà không biết" của Linh</tspan>
<tspan x="622" dy="17">Hồn Vĩnh Cửu (Thần Tiên).</tspan>
</text>    <line x1="280" y1="280" x2="330" y2="285" stroke="#111111" stroke-width="1.6"/>    <rect x="330" y="225" width="250" height="110" fill="#ffffff" stroke="#111111" stroke-width="1.6"/>
    <text x="342" y="259" font-size="18" font-weight="700" text-anchor="start">
<tspan x="342" dy="0">2. Tâm Năng Lượng</tspan>
</text>    <line x1="580" y1="280" x2="610" y2="280" stroke="#111111" stroke-width="1.6"/>    <rect x="610" y="225" width="840" height="150" fill="#ffffff" stroke="#111111" stroke-width="1.6"/>
    <text x="622" y="251" font-size="16" font-weight="400" text-anchor="start">
</text>
    <text x="622" y="283" font-size="14" font-weight="400" text-anchor="start">
<tspan x="622" dy="0">Tâm Tiềm Thức: chịu trách nhiệm về các nhận thức trực giác, đồng cảm và vận giác nhận qua Tam Đan Điền và các</tspan>
<tspan x="622" dy="17">trường năng lượng của cơ thể.</tspan>
</text>    <line x1="280" y1="280" x2="330" y2="450" stroke="#111111" stroke-width="1.6"/>    <rect x="330" y="390" width="250" height="110" fill="#ffffff" stroke="#111111" stroke-width="1.6"/>
    <text x="342" y="424" font-size="18" font-weight="700" text-anchor="start">
<tspan x="342" dy="0">1. Tâm Thể Chất</tspan>
</text>    <line x1="580" y1="445" x2="610" y2="445" stroke="#111111" stroke-width="1.6"/>    <rect x="610" y="390" width="840" height="150" fill="#ffffff" stroke="#111111" stroke-width="1.6"/>
    <text x="622" y="416" font-size="16" font-weight="400" text-anchor="start">
</text>
    <text x="622" y="448" font-size="14" font-weight="400" text-anchor="start">
<tspan x="622" dy="0">Tâm Ý Thức: chịu trách nhiệm điều tra, giải thích và đánh giá các dữ liệu nhận được qua Ngũ Cảm của cơ thể.</tspan>
</text>    <rect x="50" y="770" width="230" height="140" fill="#ffffff" stroke="#111111" stroke-width="2"/>    <text x="65" y="820" font-size="20" font-weight="700" text-anchor="start">
<tspan x="65" dy="0">BA CẤP ĐỘ CỦA HƠI THỞ</tspan>
</text>    <line x1="280" y1="840" x2="330" y2="680" stroke="#111111" stroke-width="1.6"/>    <rect x="330" y="620" width="250" height="110" fill="#ffffff" stroke="#111111" stroke-width="1.6"/>
    <text x="342" y="654" font-size="18" font-weight="700" text-anchor="start">
<tspan x="342" dy="0">3. Hơi Thở Tâm Linh</tspan>
</text>    <line x1="580" y1="675" x2="610" y2="675" stroke="#111111" stroke-width="1.6"/>    <rect x="610" y="620" width="840" height="150" fill="#ffffff" stroke="#111111" stroke-width="1.6"/>
    <text x="622" y="646" font-size="16" font-weight="400" text-anchor="start">
</text>
    <text x="622" y="678" font-size="14" font-weight="400" text-anchor="start">
<tspan x="622" dy="0">Sự triều lên và ròng xuống của nhịp và dao động vũ trụ của Tâm Thần, được cơ thể hấp thụ qua sự thong thả tĩnh lặng</tspan>
<tspan x="622" dy="17">tự nhiên, qua cầu nguyện, thiền định sâu hoặc giấc ngủ.</tspan>
</text>    <line x1="280" y1="840" x2="330" y2="845" stroke="#111111" stroke-width="1.6"/>    <rect x="330" y="785" width="250" height="110" fill="#ffffff" stroke="#111111" stroke-width="1.6"/>
    <text x="342" y="819" font-size="18" font-weight="700" text-anchor="start">
<tspan x="342" dy="0">2. Hơi Thở Năng Lượng</tspan>
</text>    <line x1="580" y1="840" x2="610" y2="840" stroke="#111111" stroke-width="1.6"/>    <rect x="610" y="785" width="840" height="150" fill="#ffffff" stroke="#111111" stroke-width="1.6"/>
    <text x="622" y="811" font-size="16" font-weight="400" text-anchor="start">
</text>
    <text x="622" y="843" font-size="14" font-weight="400" text-anchor="start">
<tspan x="622" dy="0">Sự triều lên và ròng xuống của âm thanh, ánh sáng, mùi hương và rung động Ngũ Hành được mô hấp thụ từ các trường</tspan>
<tspan x="622" dy="17">năng lượng vũ trụ và môi trường; được coi là "Hơi Thở Tế Vi".</tspan>
</text>    <line x1="280" y1="840" x2="330" y2="1010" stroke="#111111" stroke-width="1.6"/>    <rect x="330" y="950" width="250" height="110" fill="#ffffff" stroke="#111111" stroke-width="1.6"/>
    <text x="342" y="984" font-size="18" font-weight="700" text-anchor="start">
<tspan x="342" dy="0">1. Hơi Thở Thể Chất</tspan>
</text>    <line x1="580" y1="1005" x2="610" y2="1005" stroke="#111111" stroke-width="1.6"/>    <rect x="610" y="950" width="840" height="150" fill="#ffffff" stroke="#111111" stroke-width="1.6"/>
    <text x="622" y="976" font-size="16" font-weight="400" text-anchor="start">
</text>
    <text x="622" y="1008" font-size="14" font-weight="400" text-anchor="start">
<tspan x="622" dy="0">Việc hít vào và thở ra không khí vào các mô của cơ thể qua hệ hô hấp; được coi là "Hơi Thở Tự Nhiên".</tspan>
</text>    <rect x="50" y="1330" width="230" height="140" fill="#ffffff" stroke="#111111" stroke-width="2"/>    <text x="65" y="1380" font-size="20" font-weight="700" text-anchor="start">
<tspan x="65" dy="0">BA CẤP ĐỘ CỦA THÂN THỂ</tspan>
</text>    <line x1="280" y1="1400" x2="330" y2="1240" stroke="#111111" stroke-width="1.6"/>    <rect x="330" y="1180" width="250" height="110" fill="#ffffff" stroke="#111111" stroke-width="1.6"/>
    <text x="342" y="1214" font-size="18" font-weight="700" text-anchor="start">
<tspan x="342" dy="0">3. Thân Thể Tâm Linh</tspan>
</text>    <line x1="580" y1="1235" x2="610" y2="1235" stroke="#111111" stroke-width="1.6"/>    <rect x="610" y="1180" width="840" height="150" fill="#ffffff" stroke="#111111" stroke-width="1.6"/>
    <text x="622" y="1206" font-size="16" font-weight="400" text-anchor="start">
</text>
    <text x="622" y="1238" font-size="14" font-weight="400" text-anchor="start">
<tspan x="622" dy="0">Cấu trúc tâm linh của khối mô cơ thể: chịu trách nhiệm các tương tác giữa linh hồn con người, định mệnh và nghiệp,</tspan>
<tspan x="622" dy="17">ảnh hưởng đến bản chất năng lượng hỗ trợ và duy trì các cấu trúc, chức năng nội tại và ngoại tại của cơ thể.</tspan>
</text>    <line x1="280" y1="1400" x2="330" y2="1405" stroke="#111111" stroke-width="1.6"/>    <rect x="330" y="1345" width="250" height="110" fill="#ffffff" stroke="#111111" stroke-width="1.6"/>
    <text x="342" y="1379" font-size="18" font-weight="700" text-anchor="start">
<tspan x="342" dy="0">2. Thân Thể Năng Lượng</tspan>
</text>    <line x1="580" y1="1400" x2="610" y2="1400" stroke="#111111" stroke-width="1.6"/>    <rect x="610" y="1345" width="840" height="150" fill="#ffffff" stroke="#111111" stroke-width="1.6"/>
    <text x="622" y="1371" font-size="16" font-weight="400" text-anchor="start">
</text>
    <text x="622" y="1403" font-size="14" font-weight="400" text-anchor="start">
<tspan x="622" dy="0">Cấu trúc năng lượng của khối mô cơ thể: chịu trách nhiệm về dấu ấn năng lượng hỗ trợ và duy trì các cấu trúc, chức</tspan>
<tspan x="622" dy="17">năng nội tại và ngoại tại của cơ thể.</tspan>
</text>    <line x1="280" y1="1400" x2="330" y2="1570" stroke="#111111" stroke-width="1.6"/>    <rect x="330" y="1510" width="250" height="110" fill="#ffffff" stroke="#111111" stroke-width="1.6"/>
    <text x="342" y="1544" font-size="18" font-weight="700" text-anchor="start">
<tspan x="342" dy="0">1. Thân Thể Vật Lý</tspan>
</text>    <line x1="580" y1="1565" x2="610" y2="1565" stroke="#111111" stroke-width="1.6"/>    <rect x="610" y="1510" width="840" height="150" fill="#ffffff" stroke="#111111" stroke-width="1.6"/>
    <text x="622" y="1536" font-size="16" font-weight="400" text-anchor="start">
</text>
    <text x="622" y="1568" font-size="14" font-weight="400" text-anchor="start">
<tspan x="622" dy="0">Cấu trúc vật lý của khối mô cơ thể: chịu trách nhiệm căn chỉnh đúng đắn và hỗ trợ cả cấu trúc, chức năng nội tại và</tspan>
<tspan x="622" dy="17">ngoại tại của cơ thể.</tspan>
</text>  </g>
</svg>
