<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc">
  <title id="title">Hình 1.26. Năm Mức Độ Thông Tin Sinh Học chứa trong Vô Cực</title>
  <desc id="desc">Sơ đồ: Thông tin hóa học và điện của cơ thể được biểu đạt qua năm mức — Đạo (Năng lượng Thần linh), Vô Cực (Không gian Vô hạn), Thần (Năng lượng Tâm linh), Khí (Năng lượng vô hình), Tinh (Hình chất/Vật chất). Toàn bộ nhãn bằng tiếng Việt.</desc>
  <rect width="1000" height="620" fill="#ffffff"/>
  <g font-family="Be Vietnam, Noto Sans, Arial, sans-serif" fill="#111111">
    <rect x="30" y="180" width="360" height="230" rx="3" fill="none" stroke="#111111" stroke-width="2.5"/>
    <text x="210" y="225" text-anchor="middle" font-size="21" font-weight="700">Thông tin Hóa học &amp; Điện</text>
    <text x="210" y="255" text-anchor="middle" font-size="21" font-weight="700">của Cơ thể được biểu đạt</text>
    <text x="210" y="285" text-anchor="middle" font-size="21" font-weight="700">thông qua Năm Mức Độ</text>
    <text x="210" y="315" text-anchor="middle" font-size="21" font-weight="700">Thông tin Sinh học</text>
    <text x="210" y="345" text-anchor="middle" font-size="21" font-weight="700">chứa trong Vô Cực</text>

    <g stroke="#111111" stroke-width="1.8" fill="none">
      <line x1="390" y1="240" x2="620" y2="70"/>
      <line x1="390" y1="275" x2="620" y2="185"/>
      <line x1="390" y1="305" x2="620" y2="300"/>
      <line x1="390" y1="335" x2="620" y2="415"/>
      <line x1="390" y1="365" x2="620" y2="530"/>
    </g>

    <g font-size="21" font-weight="600">
      <rect x="620" y="38" width="350" height="64" rx="2" fill="none" stroke="#111111" stroke-width="2"/>
      <text x="638" y="78">Đạo: Năng lượng Thần linh</text>
      <rect x="620" y="153" width="350" height="64" rx="2" fill="none" stroke="#111111" stroke-width="2"/>
      <text x="638" y="193">Vô Cực: Không gian Vô hạn</text>
      <rect x="620" y="268" width="350" height="64" rx="2" fill="none" stroke="#111111" stroke-width="2"/>
      <text x="638" y="308">Thần: Năng lượng Tâm linh</text>
      <rect x="620" y="383" width="350" height="64" rx="2" fill="none" stroke="#111111" stroke-width="2"/>
      <text x="638" y="423">Khí: Năng lượng vô hình</text>
      <rect x="620" y="498" width="350" height="64" rx="2" fill="none" stroke="#111111" stroke-width="2"/>
      <text x="638" y="538">Tinh: Hình chất / Vật chất</text>
    </g>
  </g>
</svg>
