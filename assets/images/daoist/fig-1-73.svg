<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 620" role="img" aria-labelledby="title desc">
  <title id="title">Hình 1.73. Những quyền năng bí mật của bốn Linh Thú Thiên Giới là điều cần thiết để tạo ra quyền năng của chân thuật</title>
  <desc id="desc">Lưu đồ: Rồng Xanh (Trời-Hồn) và Hổ Trắng (Đất-Phách) tạo Thân Năng Lượng; Phượng Hoàn Đỏ (Lửa-Thần) và Rùa/Rắn Đen (Nước-Trí) tạo Thần Thể; cả hai hợp thành Chân Quyền Năng. Toàn bộ nhãn bằng tiếng Việt.</desc>
  <rect width="1300" height="620" fill="#ffffff"/>
  <g font-family="Be Vietnam, Noto Sans, Arial, sans-serif" fill="#111111" stroke="none">
    <rect x="60" y="110" width="330" height="95" fill="#ffffff" stroke="#111111" stroke-width="1.6"/>    <text x="225.0" y="162.5" font-size="15" font-weight="700" text-anchor="middle">Trời (Hồn)
Rồng Xanh — Tưởng Tượng
Dương Khí</text>
    <rect x="60" y="340" width="330" height="95" fill="#ffffff" stroke="#111111" stroke-width="1.6"/>    <text x="225.0" y="392.5" font-size="15" font-weight="700" text-anchor="middle">Lửa (Thần)
Phượng Hoàn Đỏ — Ý Định
Dương Khí</text>
    <rect x="470" y="110" width="330" height="95" fill="#ffffff" stroke="#111111" stroke-width="1.6"/>    <text x="635.0" y="162.5" font-size="15" font-weight="700" text-anchor="middle">Đất (Phách)
Hổ Trắng — Cảm Giác
Âm Khí</text>
    <rect x="470" y="340" width="330" height="95" fill="#ffffff" stroke="#111111" stroke-width="1.6"/>    <text x="635.0" y="392.5" font-size="15" font-weight="700" text-anchor="middle">Nước (Trí)
Rùa/Rắn Đen — Chú Ý
Âm Khí</text>
    <rect x="890" y="225" width="330" height="95" fill="#ffffff" stroke="#111111" stroke-width="1.6"/>    <text x="1055.0" y="277.5" font-size="15" font-weight="700" text-anchor="middle">Thân Năng Lượng</text>
    <rect x="890" y="400" width="330" height="95" fill="#ffffff" stroke="#111111" stroke-width="1.6"/>    <text x="1055.0" y="452.5" font-size="15" font-weight="700" text-anchor="middle">Thần Thể</text>
    <line x1="390" y1="205" x2="470" y2="205" stroke="#111111" stroke-width="1.8"/>
    <line x1="390" y1="435" x2="470" y2="435" stroke="#111111" stroke-width="1.8"/>
    <line x1="800" y1="270" x2="890" y2="270" stroke="#111111" stroke-width="1.8"/>
    <line x1="800" y1="445" x2="890" y2="445" stroke="#111111" stroke-width="1.8"/>
    <rect x="1110" y="300" width="170" height="90" fill="#ffffff" stroke="#111111" stroke-width="1.6"/>    <text x="1195.0" y="350.6666666666667" font-size="17" font-weight="700" text-anchor="middle">Chân Thuật</text>
    <path d="M1055 275 L1110 320 M1055 450 L1110 370" fill="none" stroke="#111111" stroke-width="1.8"/>
  </g>
</svg>
