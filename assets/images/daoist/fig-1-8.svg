<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" role="img" aria-labelledby="title desc">
  <title id="title">Hình 1.8. Nghiên cứu Ma Thuật Cao Cấp Đạo Giáo</title>
  <desc id="desc">Sơ đồ bảy nhánh nghiên cứu Ma Thuật Cao Cấp Đạo Giáo, với toàn bộ chú thích bằng tiếng Việt.</desc>
  <rect width="1280" height="800" fill="#ffffff"/>
  <g font-family="Be Vietnam, Noto Sans, Arial, sans-serif" fill="#111111">
    <!-- Connectors -->
    <g stroke="#111111" stroke-width="1.6" fill="none">
      <path d="M300 395 L360 74"/>
      <path d="M300 395 L360 179"/>
      <path d="M300 395 L360 284"/>
      <path d="M300 395 L360 389"/>
      <path d="M300 395 L360 494"/>
      <path d="M300 395 L360 599"/>
      <path d="M300 395 L360 704"/>
      <line x1="625" y1="74" x2="690" y2="74"/>
      <line x1="625" y1="179" x2="690" y2="179"/>
      <line x1="625" y1="284" x2="690" y2="284"/>
      <line x1="625" y1="389" x2="690" y2="389"/>
      <line x1="625" y1="494" x2="690" y2="494"/>
      <line x1="625" y1="599" x2="690" y2="599"/>
      <line x1="625" y1="704" x2="690" y2="704"/>
    </g>

    <!-- Root box -->
    <rect x="40" y="335" width="260" height="120" rx="3" fill="none" stroke="#111111" stroke-width="2"/>
    <text x="170" y="375" text-anchor="middle" font-size="22" font-weight="700">
      <tspan x="170" dy="0">Nghiên cứu Ma Thuật</tspan>
      <tspan x="170" dy="28">Cao Cấp Đạo Giáo</tspan>
      <tspan x="170" dy="28" font-size="19" font-weight="400">(Giả kim thuật huyền môn)</tspan>
    </text>

    <!-- Middle boxes -->
    <g fill="none" stroke="#111111" stroke-width="2">
      <rect x="360" y="30" width="265" height="88" rx="3"/>
      <rect x="360" y="135" width="265" height="88" rx="3"/>
      <rect x="360" y="240" width="265" height="88" rx="3"/>
      <rect x="360" y="345" width="265" height="88" rx="3"/>
      <rect x="360" y="450" width="265" height="88" rx="3"/>
      <rect x="360" y="555" width="265" height="88" rx="3"/>
      <rect x="360" y="660" width="265" height="88" rx="3"/>
    </g>

    <!-- Right boxes -->
    <g fill="none" stroke="#111111" stroke-width="2">
      <rect x="690" y="30" width="550" height="88" rx="3"/>
      <rect x="690" y="135" width="550" height="88" rx="3"/>
      <rect x="690" y="240" width="550" height="88" rx="3"/>
      <rect x="690" y="345" width="550" height="88" rx="3"/>
      <rect x="690" y="450" width="550" height="88" rx="3"/>
      <rect x="690" y="555" width="550" height="88" rx="3"/>
      <rect x="690" y="660" width="550" height="88" rx="3"/>
    </g>

    <!-- Middle labels -->
    <g font-size="21" text-anchor="middle">
      <text x="492" y="66"><tspan x="492" dy="0">Huấn luyện Trường sinh</tspan><tspan x="492" dy="26" font-size="18">(Tạo thần thể bất tử)</tspan></text>
      <text x="492" y="179">Ma thuật Thần linh</text>
      <text x="492" y="284">Ma thuật Chuyển hóa</text>
      <text x="492" y="389">Trừ tà</text>
      <text x="492" y="494"><tspan x="492" dy="0">Chiêm tinh</tspan><tspan x="492" dy="26" font-size="18">(Bốc toán thiên văn)</tspan></text>
      <text x="492" y="599"><tspan x="492" dy="0">Bùa chú và</tspan><tspan x="492" dy="26">Công cụ Ma pháp</tspan></text>
      <text x="492" y="704"><tspan x="492" dy="0">Mệnh số</tspan><tspan x="492" dy="26" font-size="18">(Tính toán Vận mệnh)</tspan></text>
    </g>

    <!-- Right labels -->
    <g font-size="18" text-anchor="middle">
      <text x="965" y="60">
        <tspan x="965" dy="0">Tu luyện năng lực siêu nhiên của Linh Thần trong thân thể</tspan>
        <tspan x="965" dy="25">thông qua nhập thần lành tính và triệu gọi ma pháp</tspan>
      </text>
      <text x="965" y="165">
        <tspan x="965" dy="0">Nuôi dưỡng năng lực siêu nhiên của Linh Thần</tspan>
        <tspan x="965" dy="25">thông qua nhập thần lành tính và triệu gọi ma pháp</tspan>
      </text>
      <text x="965" y="270">
        <tspan x="965" dy="0">Tiếp cận năng lực ma pháp trong lõi Trung tâm Thái Cực</tspan>
        <tspan x="965" dy="25">qua thiền sâu và triệu gọi ma pháp có hỗ trợ</tspan>
      </text>
      <text x="965" y="375">
        <tspan x="965" dy="0">Nghi lễ ma pháp dùng để triệu tập, thẩm vấn, phái khiển</tspan>
        <tspan x="965" dy="25">hoặc loại bỏ ảnh hưởng ma pháp của thực thể tinh linh</tspan>
      </text>
      <text x="965" y="480">
        <tspan x="965" dy="0">Hiểu và tương tác với các thần linh cùng năng lực ma pháp</tspan>
        <tspan x="965" dy="25">của Tam Giới: Thiên, Địa và U Minh</tspan>
      </text>
      <text x="965" y="585">
        <tspan x="965" dy="0">Khai thác và sử dụng các năng lực ma pháp</tspan>
        <tspan x="965" dy="25">của Tam Giới: Thiên, Địa và U Minh</tspan>
      </text>
      <text x="965" y="690">
        <tspan x="965" dy="0">Hiểu các ảnh hưởng ma pháp chi phối</tspan>
        <tspan x="965" dy="25">Vận mệnh và Số phận</tspan>
      </text>
    </g>
  </g>
</svg>
