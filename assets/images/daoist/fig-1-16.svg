<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1050" role="img" aria-labelledby="title desc">
  <title id="title">Hình 1.16. Năm Trường Năng Lượng (The Five Energetic Fields)</title>
  <desc id="desc">Cột năng lượng gồm các tầng Đạo, Vô Cực, Thần, Khí, Tinh (trái) tương ứng với Thần linh, Khoảng không, Tinh thần, Năng lượng, Bản chất (phải), chuyển hóa từ Tiên thiên (Đất) sang Hậu thiên (Trời). Toàn bộ nhãn bằng tiếng Việt.</desc>
  <rect width="900" height="1050" fill="#ffffff"/>
  <g font-family="Be Vietnam, Noto Sans, Arial, sans-serif" fill="#111111">
    <rect x="235" y="20" width="215" height="60" rx="2" fill="none" stroke="#111111" stroke-width="2"/>
    <text x="342" y="45" text-anchor="middle" font-size="19" font-weight="700">Chuyển hóa Tiên thiên</text>
    <text x="342" y="68" text-anchor="middle" font-size="17">(Đất → Trời)</text>
    <rect x="535" y="20" width="215" height="60" rx="2" fill="none" stroke="#111111" stroke-width="2"/>
    <text x="642" y="45" text-anchor="middle" font-size="19" font-weight="700">Chuyển hóa Hậu thiên</text>
    <text x="642" y="68" text-anchor="middle" font-size="17">(Trời → Đất)</text>

    <g stroke="#111111" stroke-width="1.8" fill="none">
      <rect x="325" y="95" width="340" height="800" fill="none" stroke-width="2"/>
      <path d="M 325 140 Q 495 165 665 140"/>
      <path d="M 325 140 Q 495 115 665 140"/>
      <path d="M 325 190 Q 495 215 665 190"/>
      <path d="M 325 240 Q 495 265 665 240"/>
      <path d="M 325 290 Q 495 315 665 290"/>
      <path d="M 325 350 Q 495 380 665 350"/>
      <path d="M 325 410 Q 495 440 665 410"/>
      <path d="M 325 470 Q 495 500 665 470"/>
      <path d="M 325 530 Q 495 560 665 530"/>
      <path d="M 325 590 Q 495 620 665 590"/>
      <line x1="325" y1="150" x2="665" y2="150"/>
      <line x1="325" y1="200" x2="665" y2="200"/>
      <line x1="325" y1="250" x2="665" y2="250"/>
      <line x1="325" y1="300" x2="665" y2="300"/>
      <line x1="325" y1="360" x2="665" y2="360"/>
      <line x1="325" y1="420" x2="665" y2="420"/>
      <line x1="325" y1="480" x2="665" y2="480"/>
      <line x1="325" y1="540" x2="665" y2="540"/>
      <line x1="325" y1="600" x2="665" y2="600"/>
      <line x1="325" y1="640" x2="665" y2="640"/>
      <line x1="325" y1="680" x2="665" y2="680"/>
      <line x1="325" y1="720" x2="665" y2="720"/>
      <line x1="325" y1="760" x2="665" y2="760"/>
      <line x1="325" y1="800" x2="665" y2="800"/>
      <line x1="325" y1="840" x2="665" y2="840"/>
    </g>

    <g font-size="20" font-weight="600">
      <ellipse cx="325" cy="140" rx="46" ry="26" fill="#ffffff" stroke="#111111" stroke-width="2"/>
      <text x="325" y="147" text-anchor="middle">Đạo</text>
      <ellipse cx="665" cy="140" rx="46" ry="26" fill="#ffffff" stroke="#111111" stroke-width="2"/>
      <text x="665" y="147" text-anchor="middle">Thần linh</text>

      <ellipse cx="325" cy="290" rx="46" ry="26" fill="#ffffff" stroke="#111111" stroke-width="2"/>
      <text x="325" y="297" text-anchor="middle">Vô Cực</text>
      <ellipse cx="665" cy="290" rx="46" ry="26" fill="#ffffff" stroke="#111111" stroke-width="2"/>
      <text x="665" y="297" text-anchor="middle">Khoảng không</text>

      <ellipse cx="325" cy="440" rx="46" ry="26" fill="#ffffff" stroke="#111111" stroke-width="2"/>
      <text x="325" y="447" text-anchor="middle">Thần</text>
      <ellipse cx="665" cy="440" rx="46" ry="26" fill="#ffffff" stroke="#111111" stroke-width="2"/>
      <text x="665" y="447" text-anchor="middle">Tinh thần</text>

      <ellipse cx="325" cy="590" rx="46" ry="26" fill="#ffffff" stroke="#111111" stroke-width="2"/>
      <text x="325" y="597" text-anchor="middle">Khí</text>
      <ellipse cx="665" cy="590" rx="46" ry="26" fill="#ffffff" stroke="#111111" stroke-width="2"/>
      <text x="665" y="597" text-anchor="middle">Năng lượng</text>

      <ellipse cx="325" cy="750" rx="46" ry="26" fill="#ffffff" stroke="#111111" stroke-width="2"/>
      <text x="325" y="757" text-anchor="middle">Tinh</text>
      <ellipse cx="665" cy="750" rx="46" ry="26" fill="#ffffff" stroke="#111111" stroke-width="2"/>
      <text x="665" y="757" text-anchor="middle">Bản chất</text>
    </g>

    <text x="450" y="945" text-anchor="middle" font-size="17" font-style="italic">Năm tầng năng lượng: từ Đạo (cao nhất) đến Tinh (thấp nhất)</text>
  </g>
</svg>
