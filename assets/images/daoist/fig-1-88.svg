<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" role="img" aria-labelledby="title desc">
  <title id="title">Hình 1.88. Bốn con đường để tu dưỡng thần</title>
  <desc id="desc">Vòng tròn chia bốn phần quanh tâm Thần: Nuôi dưỡng và Củng cố Thần (#1), An trú Thần (#2), Kết hợp Thần với Hô hấp (#3), Kết hợp Thần với Khí (#4). Toàn bộ nhãn bằng tiếng Việt.</desc>
  <rect width="900" height="760" fill="#ffffff"/>
  <g font-family="Be Vietnam, Noto Sans, Arial, sans-serif" fill="#111111" stroke="none">
    <circle cx="450" cy="380" r="290" fill="#ffffff" stroke="#111111" stroke-width="2"/>
    <line x1="450" y1="380" x2="655.1" y2="585.1" stroke="#111111" stroke-width="1.8"/>
    <line x1="450" y1="380" x2="244.9" y2="585.1" stroke="#111111" stroke-width="1.8"/>
    <line x1="450" y1="380" x2="244.9" y2="174.9" stroke="#111111" stroke-width="1.8"/>
    <line x1="450" y1="380" x2="655.1" y2="174.9" stroke="#111111" stroke-width="1.8"/>
    <circle cx="450" cy="380" r="62" fill="#ffffff" stroke="#111111" stroke-width="2"/>
    <text x="450" y="388" font-size="24" font-weight="700" text-anchor="middle">Thần</text>
    <text x="450" y="175" font-size="16" font-weight="700" text-anchor="middle">
<tspan x="450" dy="0">An Trú Thần (#2)</tspan>
</text>
    <text x="680" y="365" font-size="16" font-weight="700" text-anchor="middle">
<tspan x="680" dy="0">Kết Hợp Thần Với</tspan>
<tspan x="680" dy="20">Hô Hấp (#3)</tspan>
</text>
    <text x="450" y="600" font-size="16" font-weight="700" text-anchor="middle">
<tspan x="450" dy="0">Kết Hợp Thần Với</tspan>
<tspan x="450" dy="20">Khí (#4)</tspan>
</text>
    <text x="215" y="365" font-size="16" font-weight="700" text-anchor="middle">
<tspan x="215" dy="0">Nuôi Dưỡng Và</tspan>
<tspan x="215" dy="20">Củng Cố Thần</tspan>
<tspan x="215" dy="20">(#1)</tspan>
</text>
  </g>
</svg>
