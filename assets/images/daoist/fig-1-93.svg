<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 760" role="img" aria-labelledby="title desc">
  <title id="title">Hình 1.93. Bốn Loại Đức (The Four Types of Virtues)</title>
  <desc id="desc">Sơ đồ: Bốn Loại Đức dẫn tới #1 Đức Hiển Lộ, #2 Đức Âm, #3 Đức Huyền Bí, #4 Đức Chân Thực, kèm giải thích. Toàn bộ nhãn bằng tiếng Việt.</desc>
  <rect width="1500" height="760" fill="#ffffff"/>
  <g font-family="Be Vietnam, Noto Sans, Arial, sans-serif" fill="#111111" stroke="none">
    <rect x="30" y="320" width="260" height="110" fill="#ffffff" stroke="#111111" stroke-width="1.6"/>
    <text x="160.0" y="350" font-size="17" font-weight="700" text-anchor="middle">Bốn Loại Đức</text>
    <path d="M290 375 C390 375 390 105 470 105" fill="none" stroke="#111111" stroke-width="1.5"/>
    <rect x="470" y="60" width="300" height="90" fill="#ffffff" stroke="#111111" stroke-width="1.6"/>
    <text x="620.0" y="90" font-size="15" font-weight="700" text-anchor="middle">#1 Đức Hiển Lộ</text>
    <line x1="770" y1="105" x2="810" y2="105" stroke="#111111" stroke-width="1.5"/>
    <rect x="810" y="60" width="660" height="90" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
    <text x="824" y="88" font-size="14" font-weight="400" text-anchor="start">
<tspan x="824" dy="0">Mọi hành động từ tâm đều được người khác thấy và ngay lập tức</tspan>
<tspan x="824" dy="18">được đền đáp trong cõi này bằng sự biết ơn vật chất và/hoặc</tspan>
<tspan x="824" dy="18">lời nói.</tspan>
</text>
    <path d="M290 375 C390 375 390 275 470 275" fill="none" stroke="#111111" stroke-width="1.5"/>
    <rect x="470" y="230" width="300" height="90" fill="#ffffff" stroke="#111111" stroke-width="1.6"/>
    <text x="620.0" y="260" font-size="15" font-weight="700" text-anchor="middle">#2 Đức Âm</text>
    <line x1="770" y1="275" x2="810" y2="275" stroke="#111111" stroke-width="1.5"/>
    <rect x="810" y="230" width="660" height="90" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
    <text x="824" y="258" font-size="14" font-weight="400" text-anchor="start">
<tspan x="824" dy="0">Việc tốt được thực hiện mà không mong đợi bất kỳ phần thưởng</tspan>
<tspan x="824" dy="18">nào.</tspan>
</text>
    <path d="M290 375 C390 375 390 445 470 445" fill="none" stroke="#111111" stroke-width="1.5"/>
    <rect x="470" y="400" width="300" height="90" fill="#ffffff" stroke="#111111" stroke-width="1.6"/>
    <text x="620.0" y="430" font-size="15" font-weight="700" text-anchor="middle">#3 Đức Huyền Bí</text>
    <line x1="770" y1="445" x2="810" y2="445" stroke="#111111" stroke-width="1.5"/>
    <rect x="810" y="400" width="660" height="90" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
    <text x="824" y="428" font-size="14" font-weight="400" text-anchor="start">
<tspan x="824" dy="0">Việc tốt được thực hiện mà người khác không biết đến.</tspan>
</text>
    <path d="M290 375 C390 375 390 615 470 615" fill="none" stroke="#111111" stroke-width="1.5"/>
    <rect x="470" y="570" width="300" height="90" fill="#ffffff" stroke="#111111" stroke-width="1.6"/>
    <text x="620.0" y="600" font-size="15" font-weight="700" text-anchor="middle">#4 Đức Chân Thực</text>
    <line x1="770" y1="615" x2="810" y2="615" stroke="#111111" stroke-width="1.5"/>
    <rect x="810" y="570" width="660" height="90" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
    <text x="824" y="598" font-size="14" font-weight="400" text-anchor="start">
<tspan x="824" dy="0">Việc tốt được thực hiện một cách tự nhiên, như sự biểu hiện tự</tspan>
<tspan x="824" dy="18">phát của trạng thái tâm linh nội tại của đệ tử.</tspan>
</text>
  </g>
</svg>
