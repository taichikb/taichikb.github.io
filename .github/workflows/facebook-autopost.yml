# TaichiNow -> Facebook Page autopost
#
# How it fits together
#   Make.com owns the POSTING. Two routes read the SAME queue state, so they
#   can never both post the same article:
#
#   (a) PUSH - this workflow, every 6 hours, sends the next unpublished post
#       to the Make webhook (repo secret MAKE_WEBHOOK_URL). Make maps
#       message / link / image_url and creates the Facebook post.
#
#   (b) PULL - Make's Custom API module GETs the public JSON below. It needs
#       no auth, no server, nothing to keep running:
#         GET https://taichinow.github.io/facebook/queue/next.json
#           -> { "found": true, "item": { message, link, image_url, ... } }
#
#   Both routes read facebook/publish_state.json. As soon as route (a) posts
#   an article it is recorded as published and disappears from the queue, so
#   next.json reports found:false for the rest of the day. That is why the two
#   routes are safe to leave enabled at the same time.
#
# Where the articles come from
#   config source_dirs = vi/articles, techniques, articles.
#   facebook/posts/ is NOT a source - it is the export of what has already
#   been on the TaichiNOW page, and is used only as the de-duplication
#   reference so the page is never fed its own archive back.
#
# Secrets
#   MAKE_WEBHOOK_URL  - https://hook.us2.make.com/<id>
#   Without it the publish step is skipped with a warning and only the JSON
#   endpoints are refreshed.

name: facebook-autopost

on:
  # Every 6 hours => 4 posts/day.
  # UTC 00:05 / 06:05 / 12:05 / 18:05  ==  Vietnam 07:05 / 13:05 / 19:05 / 01:05
  # A 6-hour cadence always puts one slot overnight in Vietnam; that is
  # unavoidable. Drop the '18' entry to get 3/day instead (07:05/13:05/19:05).
  # GitHub cron can drift a few minutes, hence :05 rather than :00.
  schedule:
    - cron: '5 0,6,12,18 * * *'
  push:
    branches: [main]
    paths:
      - 'vi/articles/**/index.html'
      - 'techniques/**/index.html'
      - 'articles/**/index.html'
      - 'facebook/media/generated/**'
      - 'scripts/publish_to_fb.py'
      - '.github/workflows/facebook-autopost.yml'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Send the next unpublished post to the Make webhook. publish_state.json
      # (committed below) is what stops reposts.
      - name: Publish next post
        env:
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
        run: |
          if [ -z "${MAKE_WEBHOOK_URL:-}" ]; then
            echo "::warning::MAKE_WEBHOOK_URL secret is not set - skipping the push route."
            exit 0
          fi
          python3 scripts/publish_to_fb.py --queue --send

      # Refresh the public JSON endpoints (Make's pull route + diagnostics).
      - name: Regenerate queue endpoints
        run: python3 scripts/publish_to_fb.py --emit || true

      - name: Commit state and endpoints
        run: |
          if [ -z "$(git status --porcelain facebook/)" ]; then
            echo "nothing to commit"; exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add facebook/queue facebook/publish_state.json
          git commit -m "chore(facebook): publish queue advance [skip ci]"
          git push
