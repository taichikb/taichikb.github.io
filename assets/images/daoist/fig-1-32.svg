<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600" role="img" aria-labelledby="title desc">
  <title id="title">Hình 1.32. Trong Luyện Đan Trung Hoa cổ đại, hai vòng tròn bên trong biểu tượng Âm Dương</title>
  <desc id="desc">Biểu tượng Âm Dương với hai vòng tròn: Thế giới Tinh thần (Âm) hiện hữu trong thế giới vật lý, và Thế giới Vật lý (Dương) được bao bọc bởi thế giới tinh thần; đường phân chia giữa là Thực tại Năng lượng. Toàn bộ nhãn bằng tiếng Việt.</desc>
  <rect width="1100" height="600" fill="#ffffff"/>
  <g font-family="Be Vietnam, Noto Sans, Arial, sans-serif" fill="#111111" stroke="none">
    <circle cx="550" cy="300" r="135" fill="#ffffff" stroke="#111111" stroke-width="2.2"/>
    <path d="M550 165 A135 135 0 0 1 550 435 A67.5 67.5 0 0 1 550 300 A67.5 67.5 0 0 0 550 165 Z" fill="#111111"/>
    <circle cx="550" cy="232.5" r="18" fill="#111111"/>
    <circle cx="550" cy="367.5" r="18" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
    <rect x="40" y="60" width="300" height="80" fill="#ffffff" stroke="#111111" stroke-width="1.6"/>    <text x="190.0" y="105.0" font-size="15" font-weight="700" text-anchor="middle">Thế Giới Tinh Thần (Âm)
Hiện hữu trong Thế Giới Vật Lý</text>
    <rect x="760" y="60" width="300" height="80" fill="#ffffff" stroke="#111111" stroke-width="1.6"/>    <text x="910.0" y="105.0" font-size="15" font-weight="700" text-anchor="middle">Thế Giới Vật Lý (Dương)
Được bao bọc bởi Thế Giới Tinh Thần</text>
    <rect x="375" y="40" width="350" height="60" fill="#ffffff" stroke="#111111" stroke-width="1.6"/>    <text x="550.0" y="75.0" font-size="15" font-weight="700" text-anchor="middle">Thực tại Năng lượng
Tách hai thế giới</text>
    <path d="M525 140 L500 200 L520 230" fill="none" stroke="#111111" stroke-width="1.5"/>
    <path d="M590 240 L700 160 L820 140" fill="none" stroke="#111111" stroke-width="1.5"/>
    <path d="M680 100 L680 230" fill="none" stroke="#111111" stroke-width="1.5"/>
    <text x="550" y="545" font-size="18" font-weight="700" text-anchor="middle">Âm Dương trong Luyện Đan cổ đại</text>
  </g>
</svg>
