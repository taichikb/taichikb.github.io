<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
  <title id="title">Hình 1.40. Bốn Điều Kiện Bên Ngoài Chính Yếu</title>
  <desc id="desc">Sơ đồ Bốn Điều Kiện Bên Ngoài Chính Yếu: bốn mùa (Xuân, Hạ, Thu, Đông) tương ứng với bốn yếu tố (Mộc, Hỏa, Kim, Thủy) và năng lượng Phong, Nhiệt, Khô, Hàn vận hành theo chu trình Thăng — Co — Giáng — Trương. Toàn bộ nhãn bằng tiếng Việt.</desc>
  <rect width="1100" height="620" fill="#ffffff"/>
  <g font-family="Be Vietnam, Noto Sans, Arial, sans-serif" fill="#111111" stroke="none">
    <!-- Corner elements and seasons -->
    <g font-size="20" font-weight="700" text-anchor="middle">
      <circle cx="120" cy="110" r="34" fill="none" stroke="#111111" stroke-width="2"/>
      <text x="120" y="106">Càn</text><text x="120" y="128" font-size="15" font-weight="400">(Qian)</text>
      <text x="120" y="165">Xuân</text>

      <circle cx="970" cy="110" r="34" fill="none" stroke="#111111" stroke-width="2"/>
      <text x="970" y="106">Ly</text><text x="970" y="128" font-size="15" font-weight="400">(Li)</text>
      <text x="970" y="165">Hạ</text>

      <circle cx="120" cy="505" r="34" fill="none" stroke="#111111" stroke-width="2"/>
      <text x="120" y="501">Khảm</text><text x="120" y="523" font-size="15" font-weight="400">(Kan)</text>
      <text x="120" y="560">Đông</text>

      <circle cx="970" cy="505" r="34" fill="none" stroke="#111111" stroke-width="2"/>
      <text x="970" y="501">Khôn</text><text x="970" y="523" font-size="15" font-weight="400">(Kun)</text>
      <text x="970" y="560">Thu</text>
    </g>
    <!-- Trigrams at corners -->
    <g stroke="#111111" stroke-width="6" stroke-linecap="butt">
      <!-- Qian: three solid (top-left) -->
      <line x1="75" y1="70" x2="155" y2="70"/><line x1="75" y1="80" x2="155" y2="80"/><line x1="75" y1="90" x2="155" y2="90"/>
      <!-- Li: solid-broken-solid (top-right) -->
      <line x1="925" y1="70" x2="1005" y2="70"/><line x1="925" y1="82" x2="955" y2="82"/><line x1="975" y1="82" x2="1005" y2="82"/><line x1="925" y1="94" x2="1005" y2="94"/>
      <!-- Kan: broken-solid-broken (bottom-left) -->
      <line x1="75" y1="465" x2="105" y2="465"/><line x1="125" y1="465" x2="155" y2="465"/><line x1="75" y1="477" x2="155" y2="477"/><line x1="75" y1="489" x2="105" y2="489"/><line x1="125" y1="489" x2="155" y2="489"/>
      <!-- Kun: three broken (bottom-right) -->
      <line x1="925" y1="465" x2="955" y2="465"/><line x1="975" y1="465" x2="1005" y2="465"/><line x1="925" y1="477" x2="955" y2="477"/><line x1="975" y1="477" x2="1005" y2="477"/><line x1="925" y1="489" x2="955" y2="489"/><line x1="975" y1="489" x2="1005" y2="489"/>
    </g>
    <!-- Element names between corners -->
    <g font-size="19" font-weight="600" text-anchor="middle">
      <text x="290" y="170">Yếu tố Mộc</text>
      <text x="810" y="170">Yếu tố Hỏa</text>
      <text x="290" y="470">Yếu tố Thủy</text>
      <text x="810" y="470">Yếu tố Kim</text>
    </g>
    <!-- Left and right labels -->
    <g font-size="19" font-weight="600">
      <text x="18" y="310">Khô</text>
      <text x="1035" y="310">Co lại</text>
    </g>
    <!-- Top and bottom descriptors -->
    <g font-size="18" text-anchor="middle">
      <text x="550" y="48">Dương</text>
      <text x="550" y="598">Âm</text>
    </g>
    <!-- Main central cycle -->
    <rect x="360" y="160" width="380" height="290" fill="none" stroke="#111111" stroke-width="2.5"/>
    <!-- Ascend / Descend boxes -->
    <rect x="415" y="65" width="160" height="52" fill="none" stroke="#111111" stroke-width="2"/>
    <text x="495" y="98" font-size="20" font-weight="700" text-anchor="middle">Thăng</text>
    <rect x="520" y="500" width="160" height="52" fill="none" stroke="#111111" stroke-width="2"/>
    <text x="600" y="533" font-size="20" font-weight="700" text-anchor="middle">Giáng</text>
    <!-- Connect Ascend to center, center to Descend -->
    <line x1="495" y1="117" x2="495" y2="160" stroke="#111111" stroke-width="2"/>
    <line x1="600" y1="450" x2="600" y2="500" stroke="#111111" stroke-width="2"/>
    <!-- Inner circles -->
    <circle cx="495" cy="215" r="32" fill="none" stroke="#111111" stroke-width="2"/>
    <text x="495" y="222" font-size="19" font-weight="700" text-anchor="middle">Nóng</text>
    <circle cx="710" cy="305" r="32" fill="none" stroke="#111111" stroke-width="2"/>
    <text x="710" y="312" font-size="19" font-weight="700" text-anchor="middle">Khô</text>
    <circle cx="495" cy="395" r="32" fill="none" stroke="#111111" stroke-width="2"/>
    <text x="495" y="402" font-size="19" font-weight="700" text-anchor="middle">Lạnh</text>
    <circle cx="375" cy="305" r="32" fill="none" stroke="#111111" stroke-width="2"/>
    <text x="375" y="312" font-size="19" font-weight="700" text-anchor="middle">Ẩm</text>
    <!-- Arrows showing the cyclic movement -->
    <g stroke="#111111" stroke-width="2" fill="none" marker-end="url(#arrow)">
      <path d="M495 250 L495 280 L680 280 L680 272"/>
      <path d="M678 338 L678 370 L525 370 L525 363"/>
      <path d="M465 395 L420 395 L420 335 L343 335"/>
      <path d="M343 275 L343 215 L400 215"/>
    </g>
    <defs>
      <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
        <path d="M0,0 L0,6 L9,3 z" fill="#111111"/>
      </marker>
    </defs>
  </g>
</svg>
