<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Hình 1.102. "Hạ Hỏa" — Âm Hỏa được hướng đi qua Đốc mạch, từ đỉnh đầu xuống cột sống, qua hội âm, đi lên ngực và vào tim</title>
  <desc id="desc">Sơ đồ người nghiêng với Đốc mạch (đường chấm) từ Bách Hội (A) qua Trường Cường (B) qua hội âm (C) đến Điểm Cổng Đỏ (D), kèm Thượng, Trung, Hạ Đan Điền. Toàn bộ nhãn bằng tiếng Việt.</desc>
  <rect width="1200" height="800" fill="#ffffff"/>
  <g font-family="Be Vietnam, Noto Sans, Arial, sans-serif" fill="#111111" stroke="none">
    <path d="M700 90 Q760 90 770 150 Q775 200 745 240 L760 400 Q765 520 720 600 Q680 660 640 690 L560 690 Z" fill="none" stroke="#111111" stroke-width="2"/>
    <path d="M700 90 Q660 100 655 150 Q650 190 690 220 L660 400 Q640 520 680 600" fill="none" stroke="#111111" stroke-width="2"/>
    <path d="M720 95 Q775 180 755 300 Q740 430 700 690 Q620 700 600 640" fill="none" stroke="#111111" stroke-width="3.5" stroke-dasharray="7 6"/>
    <circle cx="720" cy="75" r="6" fill="#111111"/>
    <text x="732" y="80" font-size="14" font-weight="700" text-anchor="start">(A) Bách Hội (GV-20)</text>
    <circle cx="760" cy="380" r="6" fill="#111111"/>
    <text x="772" y="385" font-size="14" font-weight="700" text-anchor="start">(B) Trường Cường (GV-1)</text>
    <circle cx="650" cy="715" r="6" fill="#111111"/>
    <text x="662" y="720" font-size="14" font-weight="700" text-anchor="start">(C) Hội Âm</text>
    <circle cx="590" cy="455" r="6" fill="#111111"/>
    <text x="602" y="460" font-size="14" font-weight="700" text-anchor="start">(D) Cổng Đỏ (CV-14)</text>
    <circle cx="700" cy="230" r="32" fill="none" stroke="#111111" stroke-width="1.6"/>
    <text x="70" y="230" font-size="17" font-weight="700" text-anchor="start">Thượng Đan Điền</text>
    <line x1="240" y1="230" x2="668" y2="230" stroke="#111111" stroke-width="1.3"/>
    <circle cx="700" cy="430" r="32" fill="none" stroke="#111111" stroke-width="1.6"/>
    <text x="70" y="430" font-size="17" font-weight="700" text-anchor="start">Trung Đan Điền</text>
    <line x1="240" y1="430" x2="668" y2="430" stroke="#111111" stroke-width="1.3"/>
    <circle cx="700" cy="610" r="32" fill="none" stroke="#111111" stroke-width="1.6"/>
    <text x="70" y="610" font-size="17" font-weight="700" text-anchor="start">Hạ Đan Điền</text>
    <line x1="240" y1="610" x2="668" y2="610" stroke="#111111" stroke-width="1.3"/>
    <text x="600" y="775" font-size="14" font-weight="700" text-anchor="middle">Âm Hỏa đi qua Đốc mạch: từ đỉnh đầu xuống cột sống, qua hội âm, lên ngực vào tim</text>
  </g>
</svg>
