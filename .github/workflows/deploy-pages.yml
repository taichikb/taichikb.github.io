name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # ---------------------------------------------------------------------------
      # GitHub Pages rejects artifacts over 1 GB, and this site is ~8.4 GB on disk.
      # Most bulk binaries live in the taichikb/taichinow-media repo and are
      # referenced from the HTML by absolute raw.githubusercontent.com URLs, so
      # they do not need to be in the Pages artifact:
      #   books/pdfs          (~5.0 GB) offloaded; links rewritten to absolute URLs
      #   assets/books        (~2.2 GB) offloaded; referenced only by absolute URLs
      #   assets/images/books (~0.9 GB) offloaded; 24.5k img/href refs rewritten
      #   downloads           (~0.02 GB) unreferenced A5 PDFs
      #   assets/images/*     the ~0.44 GB subset in .github/pages-media-exclude.txt:
      #                       files that NO page references, so dropping them is free
      # EXCEPTION — assets/pdf/ (~0.59 GB) IS included on purpose: these are the
      # PDFs the reader pages embed (pdf.js iframe / data-pdf). On the origin the
      # browser fetches them over the Pages CDN with no CORS handshake and reuses
      # the connection, so first paint is immediate instead of streaming from
      # raw.githubusercontent.com. Everything else stays excluded.
      # NOTE: tar is used rather than rsync, which is not guaranteed on the runner.
      # ---------------------------------------------------------------------------
      - name: Stage site (exclude offloaded media)
        run: |
          set -eu
          mkdir -p _site
          # Build the exclusion list: the fully-offloaded trees plus the
          # referenced-by-nothing images enumerated in the checked-in manifest.
          : > /tmp/exclude.txt
          printf '%s\n' "./.git" "./.github" "./assets/books" "./books/pdfs" \
            "./assets/images/books" "./downloads" "./_site" >> /tmp/exclude.txt
          if [ -f .github/pages-media-exclude.txt ]; then
            # manifest lines are repo-relative (assets/images/...) -> prefix "./"
            sed -e 's/^/.\//' -e '/^\.\/$/d' .github/pages-media-exclude.txt >> /tmp/exclude.txt
          fi
          echo "Exclusion entries: $(wc -l < /tmp/exclude.txt)"
          # _site must be excluded: tar writes into it while reading ".",
          # so without this the staged copy can be read back into itself and
          # the artifact doubles (590 MB repo -> 1180 MB, over the 1 GB cap).
          tar --exclude-from=/tmp/exclude.txt -cf - . | tar -xf - -C _site
          # GitHub Pages rejects artifacts over 1 GB. assets/pdf/ is deliberately
          # NOT excluded, so the artifact grows by its size — fail loudly before
          # upload if we approach the cap instead of discovering it at deploy time.
          SIZE_MB=$(du -sm _site | cut -f1)
          echo "Staged artifact size: ${SIZE_MB} MB"
          if [ "$SIZE_MB" -gt 985 ]; then
            echo "::error::Pages artifact is ${SIZE_MB} MB — over the 985 MB safety margin (hard cap 1 GB). Trim assets/pdf/ or find more unreferenced files to exclude." >&2
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
