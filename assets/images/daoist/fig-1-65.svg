<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 760" role="img" aria-labelledby="title desc">
  <title id="title">Hình 1.65. Cấp độ thứ hai của cử động nội công (cấu trúc năng lượng chữ "X")</title>
  <desc id="desc">Hình người với cấu trúc năng lượng chữ "X" nối hai vai với hai hông, kèm nhãn Vai Phải, Vai Trái, Ngực, Thắt Lưng, Hông, Hông Phải, Hông Trái. Toàn bộ nhãn bằng tiếng Việt.</desc>
  <rect width="1050" height="760" fill="#ffffff"/>
  <g font-family="Be Vietnam, Noto Sans, Arial, sans-serif" fill="#111111" stroke="none">
    <g transform="translate(300,420) scale(1.05)" stroke="#111111" stroke-width="2" fill="none" stroke-linecap="round">
<circle cx="0" cy="-190" r="24"/>
<path d="M0 -166 L0 -60"/>
<path d="M-34 -150 Q0 -162 34 -150 L40 -60"/>
<path d="M-34 -150 L-55 -40"/><path d="M34 -150 L55 -40"/>
<path d="M-28 -60 L28 -60 L20 10 L-20 10 Z"/>
<path d="M-20 10 L-30 150 M20 10 L30 150"/>
<path d="M-30 150 L-40 175 M30 150 L40 175"/>
<path d="M-55 -40 L-62 30 M55 -40 L62 30"/>
<circle cx="-62" cy="36" r="5"/><circle cx="62" cy="36" r="5"/>
<path d="M-38 -150 L38 10 M38 -150 L-38 10" stroke-width="5"/>
<rect x="-38" y="-150" width="76" height="160" stroke-width="4"/>
</g>
    <text x="150" y="250" font-size="17" font-weight="700" text-anchor="end">
<tspan x="150" dy="0">Vai Phải</tspan>
</text>
    <text x="450" y="250" font-size="17" font-weight="700" text-anchor="start">
<tspan x="450" dy="0">Vai Trái</tspan>
</text>
    <text x="385" y="330" font-size="17" font-weight="700" text-anchor="start">
<tspan x="385" dy="0">Ngực</tspan>
</text>
    <text x="385" y="430" font-size="17" font-weight="700" text-anchor="start">
<tspan x="385" dy="0">Thắt Lưng</tspan>
</text>
    <text x="385" y="520" font-size="17" font-weight="700" text-anchor="start">
<tspan x="385" dy="0">Hông</tspan>
</text>
    <text x="170" y="600" font-size="17" font-weight="700" text-anchor="end">
<tspan x="170" dy="0">Hông Phải</tspan>
</text>
    <text x="440" y="600" font-size="17" font-weight="700" text-anchor="start">
<tspan x="440" dy="0">Hông Trái</tspan>
</text>
    <text x="700" y="340" font-size="19" font-weight="700" text-anchor="middle">
<tspan x="700" dy="0">Cấu trúc năng lượng</tspan>
<tspan x="700" dy="23">chữ "X"</tspan>
</text>
    <text x="700" y="390" font-size="17" font-weight="400" text-anchor="middle">
<tspan x="700" dy="0">(Hai vai nối với hai</tspan>
<tspan x="700" dy="21">hông)</tspan>
</text>
  </g>
</svg>
