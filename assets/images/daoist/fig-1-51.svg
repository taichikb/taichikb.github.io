<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 780" role="img" aria-labelledby="title desc">
  <title id="title">Hình 1.51. Bốn Con Số Âm ở bốn góc của Phương Đình liên hệ đến sự tròn khuyết của Mặt Trăng</title>
  <desc id="desc">Phương Đình Lạc Hà với các vòng tròn mang số 4-9-2 / 3-5-7 / 8-1-6, các nhãn Tâm-Hỏa, Tỳ-Thổ, Thận-Thủy, Can-Mộc, Phế-Kim, và chu kỳ trăng từ Trăng Mới đến Trăng Tròn. Toàn bộ nhãn bằng tiếng Việt.</desc>
  <rect width="1000" height="780" fill="#ffffff"/>
  <g font-family="Be Vietnam, Noto Sans, Arial, sans-serif" fill="#111111" stroke="none">
    <!-- moon phase labels -->
    <g font-size="18" font-weight="700">
      <text x="500" y="52" text-anchor="middle">Trăng Mới</text>
      <text x="175" y="210" transform="rotate(-55 175 210)">Trăng Lưỡi Liềm Thượng</text>
      <text x="160" y="610" transform="rotate(50 160 610)">Trăng Tròn</text>
      <text x="835" y="610" transform="rotate(-50 835 610)">Trăng Lưỡi Liềm Hạ</text>
    </g>
    <!-- arrows around the square -->
    <g stroke="#111111" stroke-width="1.8" fill="none" marker-end="url(#a51)">
      <path d="M300 160 L205 205"/><path d="M200 270 L195 450"/>
      <path d="M290 660 L200 625"/><path d="M700 660 L795 625"/>
      <path d="M805 270 L805 450"/><path d="M700 160 L795 205"/>
    </g>
    <defs><marker id="a51" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#111111"/></marker></defs>
    <!-- central square -->
    <rect x="290" y="210" width="420" height="420" fill="none" stroke="#111111" stroke-width="2"/>
    <!-- nine circles, even numbers on corners are plain white -->
    <g fill="#ffffff" stroke="#111111" stroke-width="2">
      <circle cx="375" cy="295" r="45"/><circle cx="500" cy="295" r="45"/><circle cx="625" cy="295" r="45"/>
      <circle cx="375" cy="420" r="45"/><circle cx="500" cy="420" r="45"/><circle cx="625" cy="420" r="45"/>
      <circle cx="375" cy="545" r="45"/><circle cx="500" cy="545" r="45"/><circle cx="625" cy="545" r="45"/>
    </g>
    <g font-size="32" font-weight="700" text-anchor="middle">
      <text x="375" y="307">4</text><text x="500" y="307">9</text><text x="625" y="307">2</text>
      <text x="375" y="432">3</text><text x="500" y="432">5</text><text x="625" y="432">7</text>
      <text x="375" y="557">8</text><text x="500" y="557">1</text><text x="625" y="557">6</text>
    </g>
    <!-- organ/element labels -->
    <g font-size="17" font-weight="700" text-anchor="middle">
      <text x="500" y="185">Tâm</text><text x="500" y="207">Hỏa</text>
      <text x="500" y="630">Thận</text><text x="500" y="652">Thủy</text>
      <text x="500" y="405" font-size="15">Tỳ</text><text x="500" y="428" font-size="15">Thổ</text>
    </g>
    <g font-size="17" font-weight="700">
      <text x="277" y="380" text-anchor="end">Can</text><text x="277" y="402" text-anchor="end">Mộc (Gió)</text>
      <text x="723" y="380">Phế</text><text x="723" y="402">Kim (Khô)</text>
    </g>
    <g font-size="16">
      <text x="195" y="300" text-anchor="middle">Âm (Ẩm)</text>
      <text x="805" y="300" text-anchor="middle">Dương (Khô)</text>
    </g>
  </g>
</svg>
