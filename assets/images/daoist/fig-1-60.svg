<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
  <title id="title">Hình 1.60. Ba cấp độ huấn luyện cấu trúc thân thể bên trong của người nghệ sĩ võ thuật Đạo gia</title>
  <desc id="desc">Bảng so sánh ba cấp độ Minh Kính, An Kính, Hoa Kính theo cấu trúc cơ thể, biểu hiện năng lượng, Đan Điền tập trung và biểu hiện năng lượng đặc biệt. Toàn bộ nhãn bằng tiếng Việt.</desc>
  <rect width="1600" height="1120" fill="#ffffff"/>
  <g font-family="Be Vietnam, Noto Sans, Arial, sans-serif" fill="#111111" stroke="none">
    <rect x="40" y="40" width="230" height="120" fill="#ffffff" stroke="#111111" stroke-width="1.8"/>
    <rect x="40" y="160" width="230" height="160" fill="#ffffff" stroke="#111111" stroke-width="1.8"/>
    <rect x="40" y="320" width="230" height="150" fill="#ffffff" stroke="#111111" stroke-width="1.8"/>
    <rect x="40" y="470" width="230" height="110" fill="#ffffff" stroke="#111111" stroke-width="1.8"/>
    <rect x="40" y="580" width="230" height="120" fill="#ffffff" stroke="#111111" stroke-width="1.8"/>
    <rect x="40" y="700" width="230" height="360" fill="#ffffff" stroke="#111111" stroke-width="1.8"/>
    <rect x="270" y="40" width="450" height="120" fill="#ffffff" stroke="#111111" stroke-width="1.8"/>
    <rect x="270" y="160" width="450" height="160" fill="#ffffff" stroke="#111111" stroke-width="1.8"/>
    <rect x="270" y="320" width="450" height="150" fill="#ffffff" stroke="#111111" stroke-width="1.8"/>
    <rect x="270" y="470" width="450" height="110" fill="#ffffff" stroke="#111111" stroke-width="1.8"/>
    <rect x="270" y="580" width="450" height="120" fill="#ffffff" stroke="#111111" stroke-width="1.8"/>
    <rect x="270" y="700" width="450" height="360" fill="#ffffff" stroke="#111111" stroke-width="1.8"/>
    <rect x="720" y="40" width="450" height="120" fill="#ffffff" stroke="#111111" stroke-width="1.8"/>
    <rect x="720" y="160" width="450" height="160" fill="#ffffff" stroke="#111111" stroke-width="1.8"/>
    <rect x="720" y="320" width="450" height="150" fill="#ffffff" stroke="#111111" stroke-width="1.8"/>
    <rect x="720" y="470" width="450" height="110" fill="#ffffff" stroke="#111111" stroke-width="1.8"/>
    <rect x="720" y="580" width="450" height="120" fill="#ffffff" stroke="#111111" stroke-width="1.8"/>
    <rect x="720" y="700" width="450" height="360" fill="#ffffff" stroke="#111111" stroke-width="1.8"/>
    <rect x="1170" y="40" width="450" height="120" fill="#ffffff" stroke="#111111" stroke-width="1.8"/>
    <rect x="1170" y="160" width="450" height="160" fill="#ffffff" stroke="#111111" stroke-width="1.8"/>
    <rect x="1170" y="320" width="450" height="150" fill="#ffffff" stroke="#111111" stroke-width="1.8"/>
    <rect x="1170" y="470" width="450" height="110" fill="#ffffff" stroke="#111111" stroke-width="1.8"/>
    <rect x="1170" y="580" width="450" height="120" fill="#ffffff" stroke="#111111" stroke-width="1.8"/>
    <rect x="1170" y="700" width="450" height="360" fill="#ffffff" stroke="#111111" stroke-width="1.8"/>
    <text x="52" y="75" font-size="17" font-weight="700" text-anchor="start">
<tspan x="52" dy="0">Loại Năng Lượng Được</tspan>
<tspan x="52" dy="21">Sinh Ra</tspan>
</text>
    <text x="282" y="75" font-size="17" font-weight="700" text-anchor="start">
<tspan x="282" dy="0">Đạo Gia Võ Thuật Minh</tspan>
<tspan x="282" dy="21">Kính</tspan>
</text>
    <text x="732" y="75" font-size="17" font-weight="700" text-anchor="start">
<tspan x="732" dy="0">Đạo Gia Võ Thuật An</tspan>
<tspan x="732" dy="21">Kính</tspan>
</text>
    <text x="1182" y="75" font-size="17" font-weight="700" text-anchor="start">
<tspan x="1182" dy="0">Đạo Gia Võ Thuật Hoa</tspan>
<tspan x="1182" dy="21">Kính</tspan>
</text>
    <text x="52" y="130" font-size="15" font-weight="400" text-anchor="start">
<tspan x="52" dy="0">(Huấn luyện</tspan>
</text>
    <text x="52" y="152" font-size="15" font-weight="400" text-anchor="start">
<tspan x="52" dy="0">Quyền Năng)</tspan>
</text>
    <text x="282" y="135" font-size="14" font-weight="400" text-anchor="start">
<tspan x="282" dy="0">(Huấn luyện Quyền Năng</tspan>
<tspan x="282" dy="18">Rõ Ràng: Khí)</tspan>
</text>
    <text x="732" y="135" font-size="14" font-weight="400" text-anchor="start">
<tspan x="732" dy="0">(Huấn luyện Quyền Năng</tspan>
<tspan x="732" dy="18">Kín Đáo: Khí)</tspan>
</text>
    <text x="1182" y="135" font-size="14" font-weight="400" text-anchor="start">
<tspan x="1182" dy="0">(Huấn luyện Quyền Năng</tspan>
<tspan x="1182" dy="18">Huyền Bí/Hóa Chuyển:</tspan>
<tspan x="1182" dy="18">Thần)</tspan>
</text>
    <text x="52" y="195" font-size="15" font-weight="700" text-anchor="start">
<tspan x="52" dy="0">CẤU TRÚC CƠ THỂ</tspan>
</text>
    <text x="282" y="188" font-size="14" font-weight="400" text-anchor="start">
<tspan x="282" dy="0">Căn chỉnh chính xác của cấu</tspan>
<tspan x="282" dy="18">trúc xương và các nhóm cơ lớn.</tspan>
</text>
    <text x="732" y="188" font-size="14" font-weight="400" text-anchor="start">
<tspan x="732" dy="0">Gân, dây chằng, mạc nội tạng</tspan>
<tspan x="732" dy="18">và các nhóm cơ phụ.</tspan>
</text>
    <text x="1182" y="188" font-size="14" font-weight="400" text-anchor="start">
<tspan x="1182" dy="0">Ý (Yi) và Chí (Zhi) tập trung</tspan>
<tspan x="1182" dy="18">và điều hướng Khí và Thần để</tspan>
<tspan x="1182" dy="18">Sinh, Nén và Phóng Điện Bào.</tspan>
</text>
    <text x="52" y="355" font-size="15" font-weight="700" text-anchor="start">
<tspan x="52" dy="0">BIỂU HIỆN NĂNG LƯỢNG</tspan>
<tspan x="52" dy="19">CHÍNH</tspan>
</text>
    <text x="282" y="348" font-size="14" font-weight="400" text-anchor="start">
<tspan x="282" dy="0">Cấu trúc cơ thể rắn chắc, ổn</tspan>
<tspan x="282" dy="18">định và căn bằng.</tspan>
</text>
    <text x="732" y="348" font-size="14" font-weight="400" text-anchor="start">
<tspan x="732" dy="0">Cộng hưởng năng lượng rung</tspan>
<tspan x="732" dy="18">động trong xương, mô và nội</tspan>
<tspan x="732" dy="18">tạng.</tspan>
</text>
    <text x="1182" y="348" font-size="14" font-weight="400" text-anchor="start">
</text>
    <text x="52" y="505" font-size="15" font-weight="700" text-anchor="start">
<tspan x="52" dy="0">ĐAN ĐIỀN TẬP TRUNG</tspan>
</text>
    <text x="282" y="498" font-size="14" font-weight="400" text-anchor="start">
<tspan x="282" dy="0">Đan Điền Dưới (Trung tâm hạ</tspan>
<tspan x="282" dy="18">bụng)</tspan>
</text>
    <text x="732" y="498" font-size="14" font-weight="400" text-anchor="start">
<tspan x="732" dy="0">Đan Điền Giữa (Trung tâm vùng</tspan>
<tspan x="732" dy="18">tim)</tspan>
</text>
    <text x="1182" y="498" font-size="14" font-weight="400" text-anchor="start">
<tspan x="1182" dy="0">Đan Điền Trên (Trung tâm vùng</tspan>
<tspan x="1182" dy="18">đầu)</tspan>
</text>
    <text x="52" y="615" font-size="15" font-weight="700" text-anchor="start">
<tspan x="52" dy="0">MỤC TIÊU HUẤN LUYỆN</tspan>
</text>
    <text x="282" y="608" font-size="14" font-weight="400" text-anchor="start">
<tspan x="282" dy="0">Nhắm vào Hình Thể và Các Mô</tspan>
<tspan x="282" dy="18">Thể Chất.</tspan>
</text>
    <text x="732" y="608" font-size="14" font-weight="400" text-anchor="start">
<tspan x="732" dy="0">Nhắm vào Hệ Hô Hấp, Mạch và Hệ</tspan>
<tspan x="732" dy="18">Thần Kinh.</tspan>
</text>
    <text x="1182" y="608" font-size="14" font-weight="400" text-anchor="start">
<tspan x="1182" dy="0">Nhắm vào Tâm và Thần, Tư Tưởng</tspan>
<tspan x="1182" dy="18">và Ý Định.</tspan>
</text>
    <text x="52" y="735" font-size="15" font-weight="700" text-anchor="start">
<tspan x="52" dy="0">BIỂU HIỆN NĂNG LƯỢNG</tspan>
</text>
    <text x="282" y="728" font-size="14" font-weight="400" text-anchor="start">
<tspan x="282" dy="0">Bốn Điều Kỳ Diệu (Khí trong Da</tspan>
<tspan x="282" dy="18">và Cơ): Nóng, Lạnh, Giãn Nở,</tspan>
<tspan x="282" dy="18">Co Lại, Nặng, Không Trọng</tspan>
<tspan x="282" dy="18">Lượng, Rung và/hoặc Dao Động.</tspan>
</text>
    <text x="732" y="728" font-size="14" font-weight="400" text-anchor="start">
<tspan x="732" dy="0">Bốn Điều Kỳ Diệu (Khí trong</tspan>
<tspan x="732" dy="18">Dây Thần Kinh, Gân và Nội</tspan>
<tspan x="732" dy="18">Tạng): Phát Sáng, Cảm Giác Âm</tspan>
<tspan x="732" dy="18">Thanh, Cảm Giác Mùi, Cảm Giác</tspan>
<tspan x="732" dy="18">Rơi.</tspan>
</text>
    <text x="1182" y="728" font-size="14" font-weight="400" text-anchor="start">
<tspan x="1182" dy="0">Chín Điều Kỳ Diệu (Khí trong</tspan>
<tspan x="1182" dy="18">Tủy Xương và Cực Trung Đan</tspan>
<tspan x="1182" dy="18">Điền): Đệ Tử có thể tạo ra các</tspan>
<tspan x="1182" dy="18">cảm giác giác quan kỳ diệu</tspan>
<tspan x="1182" dy="18">trong bản thân và người khác</tspan>
<tspan x="1182" dy="18">theo ý muốn.</tspan>
</text>
  </g>
</svg>
