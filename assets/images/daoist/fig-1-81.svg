<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1700 1350" role="img" aria-labelledby="title desc">
  <title id="title">Hình 1.81. Biểu đồ về ba phương pháp huấn luyện của một trường chữa lành Đạo gia</title>
  <desc id="desc">Biểu đồ ba phương pháp Huấn luyện Tâm trí, Hô hấp và Tư thế của trường chữa lành Đạo gia, mỗi phương gồm Tẩy trừ, Bổ dưỡng và Điều hòa. Toàn bộ nhãn bằng tiếng Việt.</desc>
  <rect width="1700" height="1350" fill="#ffffff"/>
  <g font-family="Be Vietnam, Noto Sans, Arial, sans-serif" fill="#111111" stroke="none">
    <rect x="60" y="520" width="300" height="120" fill="#ffffff" stroke="#111111" stroke-width="1.6"/>    <text x="210.0" y="585.0" font-size="15" font-weight="700" text-anchor="middle">Huấn luyện Tâm trí
Trường Chữa Lành Đạo Gia</text>
    <path d="M360 580 C490 580 490 140 580 140" fill="none" stroke="#111111" stroke-width="1.5"/>
    <rect x="580" y="60" width="1120" height="160" fill="#ffffff" stroke="#111111" stroke-width="1.6"/>
    <text x="595" y="88" font-size="16" font-weight="700" text-anchor="start">
<tspan x="595" dy="0">Tẩy trừ</tspan>
</text>
    <text x="595" y="120" font-size="14" font-weight="400" text-anchor="start">
<tspan x="595" dy="0">Các hình dung, hình ảnh và ý định tập trung cụ thể được dùng để dẫn Khí ra</tspan>
<tspan x="595" dy="18">khỏi và xa cơ thể, nhằm Loại bỏ và Tẩy trừ Khí Thừa hoặc Độc Khí.</tspan>
</text>
    <path d="M360 580 C490 580 490 550 580 550" fill="none" stroke="#111111" stroke-width="1.5"/>
    <rect x="580" y="470" width="1120" height="160" fill="#ffffff" stroke="#111111" stroke-width="1.6"/>
    <text x="595" y="498" font-size="16" font-weight="700" text-anchor="start">
<tspan x="595" dy="0">Bổ dưỡng</tspan>
</text>
    <text x="595" y="530" font-size="14" font-weight="400" text-anchor="start">
<tspan x="595" dy="0">Các hình dung, hình ảnh và ý định tập trung cụ thể được dùng để dẫn Khí vào và</tspan>
<tspan x="595" dy="18">hướng tới cơ thể, nhằm Tăng cường và Bổ dưỡng Tình trạng Hư tổn.</tspan>
</text>
    <path d="M360 580 C490 580 490 960 580 960" fill="none" stroke="#111111" stroke-width="1.5"/>
    <rect x="580" y="880" width="1120" height="160" fill="#ffffff" stroke="#111111" stroke-width="1.6"/>
    <text x="595" y="908" font-size="16" font-weight="700" text-anchor="start">
<tspan x="595" dy="0">Điều hòa</tspan>
</text>
    <text x="595" y="940" font-size="14" font-weight="400" text-anchor="start">
<tspan x="595" dy="0">Các hình dung, hình ảnh và ý định tập trung cụ thể được dùng để dẫn Khí lưu</tspan>
<tspan x="595" dy="18">thông một cách cân bằng, nhằm Điều hòa năng lượng của cơ thể.</tspan>
</text>
    <rect x="500" y="520" width="300" height="120" fill="#ffffff" stroke="#111111" stroke-width="1.6"/>    <text x="650.0" y="585.0" font-size="15" font-weight="700" text-anchor="middle">Huấn luyện Hô hấp
Trường Chữa Lành Đạo Gia</text>
    <path d="M800 580 C930 580 930 140 1020 140" fill="none" stroke="#111111" stroke-width="1.5"/>
    <rect x="1020" y="60" width="1120" height="160" fill="#ffffff" stroke="#111111" stroke-width="1.6"/>
    <text x="1035" y="88" font-size="16" font-weight="700" text-anchor="start">
<tspan x="1035" dy="0">Tẩy trừ</tspan>
</text>
    <text x="1035" y="120" font-size="14" font-weight="400" text-anchor="start">
<tspan x="1035" dy="0">Các lần thở ra dẫn năng lượng của hơi thở để đưa Khí của cơ thể ra khỏi và xa</tspan>
<tspan x="1035" dy="18">các mô và kinh mạch, được dùng để Loại bỏ và Tẩy trừ.</tspan>
</text>
    <path d="M800 580 C930 580 930 550 1020 550" fill="none" stroke="#111111" stroke-width="1.5"/>
    <rect x="1020" y="470" width="1120" height="160" fill="#ffffff" stroke="#111111" stroke-width="1.6"/>
    <text x="1035" y="498" font-size="16" font-weight="700" text-anchor="start">
<tspan x="1035" dy="0">Bổ dưỡng</tspan>
</text>
    <text x="1035" y="530" font-size="14" font-weight="400" text-anchor="start">
<tspan x="1035" dy="0">Các lần hít vào dẫn năng lượng của hơi thở để đưa Khí vào và hướng tới các mô</tspan>
<tspan x="1035" dy="18">và kinh mạch, được dùng để Tăng cường và Bổ dưỡng.</tspan>
</text>
    <path d="M800 580 C930 580 930 960 1020 960" fill="none" stroke="#111111" stroke-width="1.5"/>
    <rect x="1020" y="880" width="1120" height="160" fill="#ffffff" stroke="#111111" stroke-width="1.6"/>
    <text x="1035" y="908" font-size="16" font-weight="700" text-anchor="start">
<tspan x="1035" dy="0">Điều hòa</tspan>
</text>
    <text x="1035" y="940" font-size="14" font-weight="400" text-anchor="start">
<tspan x="1035" dy="0">Các hơi thở dẫn năng lượng của hơi thở để đưa Khí lưu thông một cách cân bằng,</tspan>
<tspan x="1035" dy="18">được dùng để hài hòa và Điều hòa năng lượng của cơ thể.</tspan>
</text>
    <rect x="940" y="520" width="300" height="120" fill="#ffffff" stroke="#111111" stroke-width="1.6"/>    <text x="1090.0" y="585.0" font-size="15" font-weight="700" text-anchor="middle">Huấn luyện Tư thế
Trường Chữa Lành Đạo Gia</text>
    <path d="M1240 580 C1370 580 1370 140 1460 140" fill="none" stroke="#111111" stroke-width="1.5"/>
    <rect x="1460" y="60" width="1120" height="160" fill="#ffffff" stroke="#111111" stroke-width="1.6"/>
    <text x="1475" y="88" font-size="16" font-weight="700" text-anchor="start">
<tspan x="1475" dy="0">Tẩy trừ</tspan>
</text>
    <text x="1475" y="120" font-size="14" font-weight="400" text-anchor="start">
<tspan x="1475" dy="0">Các động tác tay dẫn năng lượng của cơ thể ra khỏi và xa các mô và kinh mạch,</tspan>
<tspan x="1475" dy="18">được dùng để Loại bỏ và Tẩy trừ Khí Thừa hoặc Độc Khí.</tspan>
</text>
    <path d="M1240 580 C1370 580 1370 550 1460 550" fill="none" stroke="#111111" stroke-width="1.5"/>
    <rect x="1460" y="470" width="1120" height="160" fill="#ffffff" stroke="#111111" stroke-width="1.6"/>
    <text x="1475" y="498" font-size="16" font-weight="700" text-anchor="start">
<tspan x="1475" dy="0">Bổ dưỡng</tspan>
</text>
    <text x="1475" y="530" font-size="14" font-weight="400" text-anchor="start">
<tspan x="1475" dy="0">Các động tác tay dẫn năng lượng của cơ thể đi vào và hướng tới các mô và kinh</tspan>
<tspan x="1475" dy="18">mạch, được dùng để Tăng cường và Bổ dưỡng Tình trạng Hư tổn.</tspan>
</text>
    <path d="M1240 580 C1370 580 1370 960 1460 960" fill="none" stroke="#111111" stroke-width="1.5"/>
    <rect x="1460" y="880" width="1120" height="160" fill="#ffffff" stroke="#111111" stroke-width="1.6"/>
    <text x="1475" y="908" font-size="16" font-weight="700" text-anchor="start">
<tspan x="1475" dy="0">Điều hòa</tspan>
</text>
    <text x="1475" y="940" font-size="14" font-weight="400" text-anchor="start">
<tspan x="1475" dy="0">Các động tác tay dẫn năng lượng của cơ thể lưu thông một cách cân bằng, được</tspan>
<tspan x="1475" dy="18">dùng để Điều hòa năng lượng của cơ thể.</tspan>
</text>
  </g>
</svg>
