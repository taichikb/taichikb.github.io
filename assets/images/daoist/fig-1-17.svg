<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" role="img" aria-labelledby="title desc">
  <title id="title">Hình 1.17. Năm Cõi, hay các biểu hiện của vật chất và năng lượng</title>
  <desc id="desc">Sơ đồ năm cõi năng lượng từ Trời (cao nhất) qua Con người, Động vật, Thực vật, đến Khoáng vật/Đất (thấp nhất), kèm mức độ rung động. Toàn bộ nhãn bằng tiếng Việt; chú thích ảnh tách riêng trong bài.</desc>
  <rect width="1000" height="660" fill="#ffffff"/>
  <g font-family="Be Vietnam, Noto Sans, Arial, sans-serif" fill="#111111">
    <rect x="410" y="15" width="180" height="46" rx="2" fill="none" stroke="#111111" stroke-width="2"/>
    <text x="500" y="45" text-anchor="middle" font-size="23" font-weight="700">Trời</text>

    <g stroke="#111111" stroke-width="2" fill="none">
      <line x1="500" y1="61" x2="500" y2="95" marker-end="url(#ar)"/>
    </g>
    <defs>
      <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#111111"/>
      </marker>
    </defs>

    <rect x="270" y="100" width="660" height="76" rx="2" fill="none" stroke="#111111" stroke-width="2"/>
    <text x="600" y="132" text-anchor="middle" font-size="20" font-weight="700">Trường Năng Lượng Thần Linh</text>
    <text x="600" y="160" text-anchor="middle" font-size="17">Biểu hiện rung động cao nhất của Năng lượng — Bao trùm mọi Trường Năng Lượng và Cõi Hiện Hữu</text>

    <rect x="150" y="192" width="95" height="44" rx="2" fill="none" stroke="#111111" stroke-width="2"/>
    <text x="197" y="221" text-anchor="middle" font-size="19" font-weight="600">Con người</text>
    <rect x="270" y="192" width="660" height="44" rx="2" fill="none" stroke="#111111" stroke-width="2"/>
    <text x="600" y="221" text-anchor="middle" font-size="18">Trường Năng Lượng Con Người — Rung động cao thứ hai</text>

    <rect x="150" y="248" width="95" height="44" rx="2" fill="none" stroke="#111111" stroke-width="2"/>
    <text x="197" y="277" text-anchor="middle" font-size="19" font-weight="600">Động vật</text>
    <rect x="270" y="248" width="660" height="44" rx="2" fill="none" stroke="#111111" stroke-width="2"/>
    <text x="600" y="277" text-anchor="middle" font-size="18">Trường Năng Lượng Động Vật — Rung động cao hơn thực vật</text>

    <rect x="150" y="304" width="95" height="44" rx="2" fill="none" stroke="#111111" stroke-width="2"/>
    <text x="197" y="333" text-anchor="middle" font-size="19" font-weight="600">Thực vật</text>
    <rect x="270" y="304" width="660" height="44" rx="2" fill="none" stroke="#111111" stroke-width="2"/>
    <text x="600" y="333" text-anchor="middle" font-size="18">Trường Năng Lượng Thực Vật — Rung động cao hơn khoáng vật</text>

    <rect x="150" y="360" width="95" height="76" rx="2" fill="none" stroke="#111111" stroke-width="2"/>
    <text x="197" y="397" text-anchor="middle" font-size="19" font-weight="600">Khoáng vật</text>
    <rect x="270" y="360" width="660" height="76" rx="2" fill="none" stroke="#111111" stroke-width="2"/>
    <text x="600" y="392" text-anchor="middle" font-size="18">Đất và Khoáng vật: Trường Năng Lượng</text>
    <text x="600" y="418" text-anchor="middle" font-size="18">được coi là hình thức rung động chậm nhất</text>

    <g stroke="#111111" stroke-width="1.4" fill="none">
      <line x1="500" y1="95" x2="500" y2="510" marker-end="url(#ar)"/>
      <path d="M 500 470 L 470 495 M 500 470 L 530 495"/>
      <rect x="60" y="460" width="880" height="110" fill="url(#hatch)" stroke="none"/>
    </g>
    <defs>
      <pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
        <line x1="0" y1="0" x2="0" y2="18" stroke="#111111" stroke-width="1.4"/>
      </pattern>
    </defs>

    <rect x="410" y="483" width="180" height="46" rx="2" fill="#ffffff" stroke="#111111" stroke-width="2"/>
    <text x="500" y="513" text-anchor="middle" font-size="23" font-weight="700">Đất</text>

    <text x="500" y="625" text-anchor="middle" font-size="17" font-style="italic">Mũi tên đi lên: tần số rung động tăng dần · Từ Khoáng vật → Thực vật → Động vật → Con người → Thần linh</text>
  </g>
</svg>
