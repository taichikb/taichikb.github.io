<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc">
  <title id="title">Hình 1.34. Năng lượng Âm – Dương sinh ra Bốn Tướng của Vũ Trụ</title>
  <desc id="desc">Sơ đồ Âm Dương, biểu tượng Thái Cực và bốn tướng Thiếu Dương, Thái Dương, Thiếu Âm, Thái Âm, với chú thích tiếng Việt.</desc>
  <rect width="1000" height="620" fill="#ffffff"/>
  <g font-family="Be Vietnam, Noto Sans, Arial, sans-serif" fill="#111111">
    <!-- Outer frame -->
    <rect x="20" y="20" width="960" height="560" rx="4" fill="none" stroke="#111111" stroke-width="2"/>

    <!-- Top source -->
    <rect x="355" y="38" width="290" height="52" rx="2" fill="none" stroke="#111111" stroke-width="2"/>
    <text x="500" y="71" text-anchor="middle" font-size="25" font-weight="700">Âm và Dương</text>

    <!-- Connectors from source -->
    <g stroke="#111111" stroke-width="1.6" fill="none">
      <line x1="440" y1="90" x2="320" y2="130"/>
      <line x1="560" y1="90" x2="680" y2="130"/>
    </g>

    <!-- Yang box -->
    <g stroke="#111111" fill="none" stroke-width="2">
      <rect x="120" y="130" width="260" height="105"/>
      <line x1="120" y1="180" x2="380" y2="180"/>
      <line x1="120" y1="210" x2="380" y2="210"/>
    </g>
    <text x="250" y="165" text-anchor="middle" font-size="27" font-weight="700">Dương</text>
    <rect x="205" y="169" width="90" height="9" fill="#111111"/>
    <text x="250" y="202" text-anchor="middle" font-size="21">Vô hình</text>
    <text x="250" y="231" text-anchor="middle" font-size="21">Sinh năng lượng</text>

    <!-- Yin box -->
    <g stroke="#111111" fill="none" stroke-width="2">
      <rect x="620" y="130" width="260" height="105"/>
      <line x1="620" y1="180" x2="880" y2="180"/>
      <line x1="620" y1="210" x2="880" y2="210"/>
    </g>
    <text x="750" y="165" text-anchor="middle" font-size="27" font-weight="700">Âm</text>
    <g stroke="#111111" stroke-width="9">
      <line x1="705" y1="173" x2="740" y2="173"/>
      <line x1="760" y1="173" x2="795" y2="173"/>
    </g>
    <text x="750" y="202" text-anchor="middle" font-size="21">Hữu hình</text>
    <text x="750" y="231" text-anchor="middle" font-size="21">Sinh hình thể</text>

    <!-- Central taiji symbol -->
    <g transform="translate(500 182)">
      <circle r="62" fill="#ffffff" stroke="#111111" stroke-width="2"/>
      <defs><clipPath id="taiji34"><circle r="62"/></clipPath></defs>
      <g clip-path="url(#taiji34)">
        <path d="M0,-62 A62,62 0 0,1 0,62 A31,31 0 0,0 0,0 A31,31 0 0,1 0,-62 Z" fill="#111111"/>
        <circle cx="0" cy="-31" r="31" fill="#111111"/>
        <circle cx="0" cy="31" r="31" fill="#ffffff"/>
        <circle cx="0" cy="-31" r="7" fill="#ffffff"/>
        <circle cx="0" cy="31" r="7" fill="#111111"/>
      </g>
      <circle r="62" fill="none" stroke="#111111" stroke-width="2"/>
    </g>
    <text x="420" y="155" text-anchor="middle" font-size="14" transform="rotate(-90 420 155)">Thời gian của Đạo</text>
    <text x="580" y="155" text-anchor="middle" font-size="14" transform="rotate(90 580 155)">Không gian của Đạo</text>

    <!-- Connectors to four phases -->
    <g stroke="#111111" stroke-width="1.4" fill="none">
      <line x1="215" y1="235" x2="180" y2="285"/>
      <line x1="285" y1="235" x2="330" y2="285"/>
      <line x1="715" y1="235" x2="670" y2="285"/>
      <line x1="785" y1="235" x2="820" y2="285"/>
    </g>

    <!-- Four phase boxes -->
    <g stroke="#111111" fill="none" stroke-width="2">
      <rect x="70" y="285" width="220" height="86"/>
      <rect x="270" y="285" width="220" height="86"/>
      <rect x="520" y="285" width="220" height="86"/>
      <rect x="730" y="285" width="220" height="86"/>
    </g>
    <g font-size="19" text-anchor="middle">
      <text x="180" y="315"><tspan x="180" dy="0" font-weight="700">(1) Thiếu Dương</tspan><tspan x="180" dy="25" font-size="17">(Gỗ – Gan)</tspan></text>
      <text x="380" y="315"><tspan x="380" dy="0" font-weight="700">(2) Thái Dương</tspan><tspan x="380" dy="25" font-size="17">(Hỏa – Tâm)</tspan></text>
      <text x="630" y="315"><tspan x="630" dy="0" font-weight="700">(3) Thiếu Âm</tspan><tspan x="630" dy="25" font-size="17">(Kim – Phế)</tspan></text>
      <text x="840" y="315"><tspan x="840" dy="0" font-weight="700">(4) Thái Âm</tspan><tspan x="840" dy="25" font-size="17">(Thủy – Thận)</tspan></text>
    </g>

    <!-- Element labels -->
    <g font-size="20" font-weight="600" text-anchor="middle">
      <text x="180" y="405">Hỏa</text>
      <text x="380" y="405">Nhật</text>
      <text x="630" y="405">Thủy</text>
      <text x="840" y="405">Nguyệt</text>
    </g>

    <!-- Trigram lines -->
    <g stroke="#111111" stroke-width="11" stroke-linecap="square">
      <!-- (1) Yin over Yang -->
      <line x1="135" y1="435" x2="165" y2="435"/><line x1="195" y1="435" x2="225" y2="435"/>
      <line x1="135" y1="470" x2="225" y2="470"/>
      <!-- (2) Yang over Yang -->
      <line x1="335" y1="435" x2="425" y2="435"/>
      <line x1="335" y1="470" x2="425" y2="470"/>
      <!-- (3) Yang over Yin -->
      <line x1="585" y1="435" x2="675" y2="435"/>
      <line x1="585" y1="470" x2="615" y2="470"/><line x1="645" y1="470" x2="675" y2="470"/>
      <!-- (4) Yin over Yin -->
      <line x1="795" y1="435" x2="825" y2="435"/><line x1="855" y1="435" x2="885" y2="435"/>
      <line x1="795" y1="470" x2="825" y2="470"/><line x1="855" y1="470" x2="885" y2="470"/>
    </g>

    <!-- Inner/outer labels -->
    <g stroke="#111111" fill="none" stroke-width="2">
      <rect x="95" y="505" width="170" height="44"/>
      <rect x="295" y="505" width="170" height="44"/>
      <rect x="545" y="505" width="170" height="44"/>
      <rect x="755" y="505" width="170" height="44"/>
    </g>
    <g font-size="15" text-anchor="middle">
      <text x="180" y="534">Âm trong Dương</text>
      <text x="380" y="534">Dương trong Dương</text>
      <text x="630" y="534">Dương trong Âm</text>
      <text x="840" y="534">Âm trong Âm</text>
    </g>
  </g>
</svg>
