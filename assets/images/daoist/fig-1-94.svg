    <rect x="960" y="425" width="510" height="60" fill="#ffffff" stroke="#111111" stroke-width="1.6"/>
    <text x="1215.0" y="455" font-size="15" font-weight="700" text-anchor="middle">Hỏa Thận</text>
    <circle cx="720" cy="560" r="45" fill="#111111"/>
    <circle cx="720" cy="560" r="45" fill="none" stroke="#111111" stroke-width="2"/>
    <line x1="765" y1="560" x2="960" y2="560" stroke="#111111" stroke-width="1.5"/>
    <rect x="960" y="530" width="510" height="60" fill="#ffffff" stroke="#111111" stroke-width="1.6"/>
