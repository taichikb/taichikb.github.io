<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 900" role="img" aria-labelledby="title desc">
  <title id="title">Hình 1.91. Ngũ Quang cư ngụ bên trong Ngũ Tạng Âm</title>
  <desc id="desc">Năm vòng tròn chồng nhau quanh tâm: Tâm (Hỏa - Bình An Nội Tâm / Sương Đỏ), Gan (Mộc - Nhân Ái / Sương Xanh), Phổi (Kim - Chính Trực / Sương Trắng), Thận (Thủy - Trí Tuệ / Sương Xanh Đậm), Tỳ (Thổ - Đức Tin / Sương Vàng). Toàn bộ nhãn bằng tiếng Việt.</desc>
  <rect width="1000" height="900" fill="#ffffff"/>
  <g font-family="Be Vietnam, Noto Sans, Arial, sans-serif" fill="#111111" stroke="none">
    <circle cx="500" cy="175" r="125" fill="#ffffff" stroke="#111111" stroke-width="1.8"/>
    <text x="500" y="165" font-size="15" font-weight="700" text-anchor="middle">
<tspan x="500" dy="0">Yếu Tố Hỏa Tâm —</tspan>
<tspan x="500" dy="19">Bình An Nội Tâm</tspan>
</text>
    <text x="500" y="265" font-size="14" font-weight="400" text-anchor="middle">Sương Đỏ</text>
    <circle cx="750" cy="400" r="125" fill="#ffffff" stroke="#111111" stroke-width="1.8"/>
    <text x="750" y="390" font-size="15" font-weight="700" text-anchor="middle">
<tspan x="750" dy="0">Yếu Tố Kim Phổi —</tspan>
<tspan x="750" dy="19">Chính Trực</tspan>
</text>
    <text x="750" y="490" font-size="14" font-weight="400" text-anchor="middle">Sương Trắng</text>
    <circle cx="655" cy="650" r="125" fill="#ffffff" stroke="#111111" stroke-width="1.8"/>
    <text x="655" y="640" font-size="15" font-weight="700" text-anchor="middle">
<tspan x="655" dy="0">Yếu Tố Thủy Thận —</tspan>
<tspan x="655" dy="19">Trí Tuệ</tspan>
</text>
    <text x="655" y="740" font-size="14" font-weight="400" text-anchor="middle">Sương Xanh Đậm</text>
    <circle cx="345" cy="650" r="125" fill="#ffffff" stroke="#111111" stroke-width="1.8"/>
    <text x="345" y="640" font-size="15" font-weight="700" text-anchor="middle">
<tspan x="345" dy="0">Yếu Tố Thổ Tỳ —</tspan>
<tspan x="345" dy="19">Đức Tin</tspan>
</text>
    <text x="345" y="740" font-size="14" font-weight="400" text-anchor="middle">Sương Vàng</text>
    <circle cx="250" cy="400" r="125" fill="#ffffff" stroke="#111111" stroke-width="1.8"/>
    <text x="250" y="390" font-size="15" font-weight="700" text-anchor="middle">
<tspan x="250" dy="0">Yếu Tố Mộc Gan —</tspan>
<tspan x="250" dy="19">Nhân Ái</tspan>
</text>
    <text x="250" y="490" font-size="14" font-weight="400" text-anchor="middle">Sương Xanh</text>
    <circle cx="500" cy="400" r="105" fill="#ffffff" stroke="#111111" stroke-width="1.8"/>
    <text x="500" y="395" font-size="15" font-weight="700" text-anchor="middle">
<tspan x="500" dy="0">Yếu Tố Thổ</tspan>
</text>
    <text x="500" y="425" font-size="14" font-weight="400" text-anchor="middle">Tỳ — Đức Tin</text>
    <text x="500" y="860" font-size="17" font-weight="700" text-anchor="middle">Ngũ Quang cư ngụ trong Ngũ Tạng Âm</text>
  </g>
</svg>
