<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Hình 1.44. Biểu tượng ma thuật và mô thức bí truyền của các quẻ Bát Quái Tiên Thiên</title>
  <desc id="desc">Sơ đồ Bát Quái Tiên Thiên: tám quẻ (Càn, Đoài, Ly, Chấn, Tốn, Khảm, Cấn, Khôn) xếp vòng tròn quanh tâm, kèm bốn mùa và các phẩm tính tương ứng. Toàn bộ nhãn bằng tiếng Việt.</desc>
  <rect width="1200" height="760" fill="#ffffff"/>
  <g font-family="Be Vietnam, Noto Sans, Arial, sans-serif" fill="#111111" stroke="none">
    <!-- seasons -->
    <g stroke="#111111" stroke-width="1.6" fill="#ffffff">
      <rect x="545" y="22" width="110" height="36"/>
      <rect x="545" y="702" width="110" height="36"/>
      <rect x="58" y="310" width="42" height="140"/>
      <rect x="1100" y="310" width="42" height="140"/>
    </g>
    <g font-size="18" font-weight="700" text-anchor="middle">
      <text x="600" y="47">Hè</text>
      <text x="600" y="727">Đông</text>
      <text x="79" y="388" writing-mode="tb">Xuân</text>
      <text x="1121" y="388" writing-mode="tb">Thu</text>
    </g>
    <!-- radial spokes -->
    <g stroke="#111111" stroke-width="1.4">
      <line x1="600" y1="370" x2="600" y2="255"/>
      <line x1="600" y1="370" x2="681" y2="289"/>
      <line x1="600" y1="370" x2="715" y2="370"/>
      <line x1="600" y1="370" x2="681" y2="451"/>
      <line x1="600" y1="370" x2="600" y2="485"/>
      <line x1="600" y1="370" x2="519" y2="451"/>
      <line x1="600" y1="370" x2="485" y2="370"/>
      <line x1="600" y1="370" x2="519" y2="289"/>
    </g>
    <!-- trigram bars: solid S, broken B -->
    <g stroke="#111111" stroke-width="7" stroke-linecap="butt">
      <!-- Qian (top) S S S -->
      <g transform="translate(600,255)"><line x1="-22" y1="-15" x2="22" y2="-15"/><line x1="-22" y1="0" x2="22" y2="0"/><line x1="-22" y1="15" x2="22" y2="15"/></g>
      <!-- Xun (upper right) S S B -->
      <g transform="translate(681,289)"><line x1="-22" y1="-15" x2="22" y2="-15"/><line x1="-22" y1="0" x2="22" y2="0"/><line x1="-22" y1="15" x2="-5" y2="15"/><line x1="5" y1="15" x2="22" y2="15"/></g>
      <!-- Kan (right) B S B -->
      <g transform="translate(715,370)"><line x1="-22" y1="-15" x2="-5" y2="-15"/><line x1="5" y1="-15" x2="22" y2="-15"/><line x1="-22" y1="0" x2="22" y2="0"/><line x1="-22" y1="15" x2="-5" y2="15"/><line x1="5" y1="15" x2="22" y2="15"/></g>
      <!-- Gen (lower right) S B B -->
      <g transform="translate(681,451)"><line x1="-22" y1="-15" x2="22" y2="-15"/><line x1="-22" y1="0" x2="-5" y2="0"/><line x1="5" y1="0" x2="22" y2="0"/><line x1="-22" y1="15" x2="-5" y2="15"/><line x1="5" y1="15" x2="22" y2="15"/></g>
      <!-- Kun (bottom) B B B -->
      <g transform="translate(600,485)"><line x1="-22" y1="-15" x2="-5" y2="-15"/><line x1="5" y1="-15" x2="22" y2="-15"/><line x1="-22" y1="0" x2="-5" y2="0"/><line x1="5" y1="0" x2="22" y2="0"/><line x1="-22" y1="15" x2="-5" y2="15"/><line x1="5" y1="15" x2="22" y2="15"/></g>
      <!-- Zhen (lower left) B B S -->
      <g transform="translate(519,451)"><line x1="-22" y1="-15" x2="-5" y2="-15"/><line x1="5" y1="-15" x2="22" y2="-15"/><line x1="-22" y1="0" x2="-5" y2="0"/><line x1="5" y1="0" x2="22" y2="0"/><line x1="-22" y1="15" x2="22" y2="15"/></g>
      <!-- Li (left) S B S -->
      <g transform="translate(485,370)"><line x1="-22" y1="-15" x2="22" y2="-15"/><line x1="-22" y1="0" x2="-5" y2="0"/><line x1="5" y1="0" x2="22" y2="0"/><line x1="-22" y1="15" x2="22" y2="15"/></g>
      <!-- Dui (upper left) B S S -->
      <g transform="translate(519,289)"><line x1="-22" y1="-15" x2="-5" y2="-15"/><line x1="5" y1="-15" x2="22" y2="-15"/><line x1="-22" y1="0" x2="22" y2="0"/><line x1="-22" y1="15" x2="22" y2="15"/></g>
    </g>
    <!-- sequence numbers -->
    <g font-size="15" font-weight="700" text-anchor="middle">
      <text x="600" y="200">(8)</text><text x="745" y="260">(1)</text><text x="782" y="345">(2)</text>
      <text x="745" y="485">(3)</text><text x="600" y="545">(4)</text><text x="455" y="485">(5)</text>
      <text x="418" y="345">(6)</text><text x="455" y="260">(7)</text>
    </g>
    <!-- labels -->
    <g font-size="19">
      <g text-anchor="middle">
        <text x="600" y="130" font-weight="700">Trời (Càn)</text>
        <text x="600" y="158">Không Gian Vô Hạn</text>
        <text x="600" y="655" font-weight="700">Đất (Khôn)</text>
        <text x="600" y="683">Vật Chất Đậm Đặc</text>
      </g>
      <g text-anchor="start">
        <text x="810" y="205" font-weight="700">Gió (Tốn)</text>
        <text x="810" y="233">Trực Giác Nhận Thức</text>
        <text x="810" y="315" font-weight="700">Nước (Khảm)</text>
        <text x="810" y="343">Không Gian &amp; Chuyển Động</text>
        <text x="810" y="445" font-weight="700">Núi (Cấn)</text>
        <text x="810" y="473">Ổn Định Vững Chắc</text>
      </g>
      <g text-anchor="end">
        <text x="390" y="205" font-weight="700">Đầm (Đoài)</text>
        <text x="390" y="233">Quan Sát Thấu Triệt</text>
        <text x="390" y="315" font-weight="700">Lửa (Ly)</text>
        <text x="390" y="343">Ánh Sáng Thấu Suốt</text>
        <text x="390" y="445" font-weight="700">Sấm (Chấn)</text>
        <text x="390" y="473">Sinh Trưởng &amp; Sức Mạnh</text>
      </g>
    </g>
  </g>
</svg>
