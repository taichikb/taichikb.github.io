<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 760" role="img" aria-labelledby="title desc">
  <title id="title">Hình 1.94. Sự Hình Thành Nội Tại Của Chân Hỏa Của Thân Thể</title>
  <desc id="desc">Hình người với ba đám cháy nội tại: Hỏa Tim (Lửa Hoàng Đế) ở ngực, Hỏa Thận (Lửa Tể Tướng) ở bụng, Hỏa Bàng Quang (Lửa Dân Thường) ở hạ bộ; kèm Biển Tủy, Biển Dưỡng Chất, Biển Khí, và các chuyển hóa Khí→Thần, Tinh→Khí, Dịch Cơ Thể. Toàn bộ nhãn bằng tiếng Việt.</desc>
