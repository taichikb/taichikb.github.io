<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 800" role="img" aria-labelledby="title desc">
  <title id="title">Hình 1.52. Biểu tượng ma thuật và mô thức bí truyền của các quẻ Bát Quái Hậu Thiên</title>
  <desc id="desc">Bát Quái Hậu Thiên (Cõi Dương - Nhân giới): tám quẻ xếp vòng tròn kèm phẩm tính, và Phương Đình Lạc Hà với chu kỳ Mặt Trăng. Toàn bộ nhãn bằng tiếng Việt.</desc>
  <rect width="1500" height="800" fill="#ffffff"/>
  <g font-family="Be Vietnam, Noto Sans, Arial, sans-serif" fill="#111111" stroke="none">
    <!-- LEFT: Postnatal Bagua wheel -->
    <g>
      <rect x="20" y="20" width="930" height="760" fill="none" stroke="#111111" stroke-width="1.6"/>
      <!-- spokes -->
      <g stroke="#111111" stroke-width="1.3">
        <line x1="470" y1="400" x2="470" y2="300"/><line x1="470" y1="400" x2="550" y2="320"/>
        <line x1="470" y1="400" x2="590" y2="400"/><line x1="470" y1="400" x2="550" y2="480"/>
        <line x1="470" y1="400" x2="470" y2="500"/><line x1="470" y1="400" x2="390" y2="480"/>
        <line x1="470" y1="400" x2="350" y2="400"/><line x1="470" y1="400" x2="390" y2="320"/>
      </g>
      <!-- trigrams: Li top, Kun UR, Dui R, Qian LR, Kan B, Gen LL, Zhen L, Xun UL -->
      <g stroke="#111111" stroke-width="7" stroke-linecap="butt">
        <g transform="translate(470,300)"><line x1="-22" y1="-15" x2="22" y2="-15"/><line x1="-22" y1="0" x2="-5" y2="0"/><line x1="5" y1="0" x2="22" y2="0"/><line x1="-22" y1="15" x2="22" y2="15"/></g>
        <g transform="translate(550,320)"><line x1="-22" y1="-15" x2="-5" y2="-15"/><line x1="5" y1="-15" x2="22" y2="-15"/><line x1="-22" y1="0" x2="-5" y2="0"/><line x1="5" y1="0" x2="22" y2="0"/><line x1="-22" y1="15" x2="-5" y2="15"/><line x1="5" y1="15" x2="22" y2="15"/></g>
        <g transform="translate(590,400)"><line x1="-22" y1="-15" x2="-5" y2="-15"/><line x1="5" y1="-15" x2="22" y2="-15"/><line x1="-22" y1="0" x2="22" y2="0"/><line x1="-22" y1="15" x2="22" y2="15"/></g>
        <g transform="translate(550,480)"><line x1="-22" y1="-15" x2="22" y2="-15"/><line x1="-22" y1="0" x2="22" y2="0"/><line x1="-22" y1="15" x2="22" y2="15"/></g>
        <g transform="translate(470,500)"><line x1="-22" y1="-15" x2="-5" y2="-15"/><line x1="5" y1="-15" x2="22" y2="-15"/><line x1="-22" y1="0" x2="22" y2="0"/><line x1="-22" y1="15" x2="-5" y2="15"/><line x1="5" y1="15" x2="22" y2="15"/></g>
        <g transform="translate(390,480)"><line x1="-22" y1="-15" x2="22" y2="-15"/><line x1="-22" y1="0" x2="-5" y2="0"/><line x1="5" y1="0" x2="22" y2="0"/><line x1="-22" y1="15" x2="-5" y2="15"/><line x1="5" y1="15" x2="22" y2="15"/></g>
        <g transform="translate(350,400)"><line x1="-22" y1="-15" x2="-5" y2="-15"/><line x1="5" y1="-15" x2="22" y2="-15"/><line x1="-22" y1="0" x2="-5" y2="0"/><line x1="5" y1="0" x2="22" y2="0"/><line x1="-22" y1="15" x2="22" y2="15"/></g>
        <g transform="translate(390,320)"><line x1="-22" y1="-15" x2="22" y2="-15"/><line x1="-22" y1="0" x2="22" y2="0"/><line x1="-22" y1="15" x2="-5" y2="15"/><line x1="5" y1="15" x2="22" y2="15"/></g>
      </g>
      <!-- names around wheel -->
      <g font-size="18" font-weight="700" text-anchor="middle">
        <text x="470" y="245">Lửa (Ly) (3)</text>
        <text x="600" y="285">Đất (Khôn) (4)</text>
        <text x="665" y="395">Đầm (Đoài) (5)</text>
        <text x="600" y="525">Trời (Càn) (6)</text>
        <text x="470" y="560">Nước (Khảm) (7)</text>
        <text x="335" y="525">Núi (Cấn) (8)</text>
        <text x="275" y="395">Sấm (Chấn) (1)</text>
        <text x="335" y="285">Gió (Tốn) (2)</text>
      </g>
      <!-- description boxes -->
      <g font-size="13">
        <rect x="385" y="55" width="290" height="72" fill="#ffffff" stroke="#111111" stroke-width="1.3"/>
        <text x="395" y="75">Tâm Thức, Ánh Sáng Thấu Suốt,</text><text x="395" y="95">Năm Đức Hạnh Nguyên Thủy</text>
        <rect x="645" y="130" width="285" height="62" fill="#ffffff" stroke="#111111" stroke-width="1.3"/>
        <text x="655" y="152">Cởi Mở, Tiếp Nhận</text><text x="655" y="172">và Mầu Mỡ</text>
        <rect x="675" y="430" width="265" height="68" fill="#ffffff" stroke="#111111" stroke-width="1.3"/>
        <text x="685" y="452">Chiêm Nghiệm Phản Chiếu,</text><text x="685" y="472">Quan Sát Thấu Triệt</text>
        <rect x="640" y="650" width="300" height="70" fill="#ffffff" stroke="#111111" stroke-width="1.3"/>
        <text x="650" y="672">Sức Mạnh Sáng Tạo, Ý Định</text><text x="650" y="692">Thần Thánh, Không Gian Vô Hạn</text>
        <rect x="390" y="690" width="290" height="72" fill="#ffffff" stroke="#111111" stroke-width="1.3"/>
        <text x="400" y="712">Chiều Sâu Tâm Linh Tối Đa,</text><text x="400" y="732">Số Phận Cá Nhân</text>
        <rect x="90" y="650" width="290" height="70" fill="#ffffff" stroke="#111111" stroke-width="1.3"/>
        <text x="100" y="672">Tĩnh Lặng, Chiêm Nghiệm</text><text x="100" y="692">Hướng Nội</text>
        <rect x="45" y="430" width="265" height="68" fill="#ffffff" stroke="#111111" stroke-width="1.3"/>
        <text x="55" y="452">Thức Tỉnh, Ý Thức,</text><text x="55" y="472">Sinh Lực Năng Động</text>
        <rect x="55" y="130" width="285" height="72" fill="#ffffff" stroke="#111111" stroke-width="1.3"/>
        <text x="65" y="152">Nội Tâm, Trực Giác,</text><text x="65" y="172">Chuyển Hóa</text>
      </g>
    </g>
    <!-- RIGHT: Postnatal magic square -->
    <g>
      <rect x="975" y="20" width="505" height="760" fill="none" stroke="#111111" stroke-width="1.6"/>
      <circle cx="1228" cy="400" r="290" fill="none" stroke="#111111" stroke-width="2"/>
      <g font-size="17" font-weight="700" text-anchor="middle">
        <text x="1228" y="85">(9)</text><text x="1390" y="250">(2)</text><text x="1455" y="405">(7)</text>
        <text x="1390" y="565">(6)</text><text x="1228" y="725">(1)</text><text x="1065" y="565">(8)</text>
        <text x="1005" y="405">(3)</text><text x="1065" y="250">(4)</text>
      </g>
      <rect x="1105" y="270" width="245" height="245" fill="none" stroke="#111111" stroke-width="2"/>
      <g>
        <line x1="1105" y1="270" x2="1350" y2="515" stroke="#111111" stroke-width="1.6"/>
        <line x1="1350" y1="270" x2="1105" y2="515" stroke="#111111" stroke-width="1.6"/>
      </g>
      <g font-size="26" font-weight="700" text-anchor="middle" fill="#ffffff" stroke="#111111" stroke-width="2">
        <circle cx="1145" cy="310" r="26"/><circle cx="1228" cy="310" r="26"/><circle cx="1310" cy="310" r="26"/>
        <circle cx="1145" cy="392" r="26"/><circle cx="1228" cy="392" r="26"/><circle cx="1310" cy="392" r="26"/>
        <circle cx="1145" cy="475" r="26"/><circle cx="1228" cy="475" r="26"/><circle cx="1310" cy="475" r="26"/>
      </g>
      <g font-size="24" font-weight="700" text-anchor="middle">
        <text x="1145" y="319">4</text><text x="1228" y="319">9</text><text x="1310" y="319">2</text>
        <text x="1145" y="401">3</text><text x="1228" y="401">5</text><text x="1310" y="401">7</text>
        <text x="1145" y="484">8</text><text x="1228" y="484">1</text><text x="1310" y="484">6</text>
      </g>
      <rect x="1110" y="590" width="240" height="40" fill="#ffffff" stroke="#111111" stroke-width="1.4"/>
      <text x="1230" y="617" font-size="17" font-weight="700" text-anchor="middle">Phương Đình Bát Quái Hậu Thiên</text>
    </g>
  </g>
</svg>
