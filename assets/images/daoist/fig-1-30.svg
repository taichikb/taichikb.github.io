<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Hình 1.30. "Thái Cực" — Đại Cực</title>
  <desc id="desc">Biểu tượng Thái Cực gồm hai nửa Âm-Dương tương phản, kèm chữ Hán Thái (Đại) và Cực (Tối). Toàn bộ nhãn bằng tiếng Việt.</desc>
  <rect width="900" height="520" fill="#ffffff"/>
  <g font-family="Be Vietnam, Noto Sans, Arial, sans-serif" fill="#111111" stroke="none">
    <text x="120" y="150" font-size="24" font-weight="700" text-anchor="middle">Thái</text>
    <text x="120" y="180" font-size="16" font-weight="400" text-anchor="start">(Đại)</text>
    <text x="120" y="270" font-size="24" font-weight="700" text-anchor="middle">Cực</text>
    <text x="120" y="300" font-size="16" font-weight="400" text-anchor="start">(Tối)</text>
    <circle cx="560" cy="260" r="150" fill="#ffffff" stroke="#111111" stroke-width="2.5"/>
    <path d="M560 110 A150 150 0 0 1 560 410 A75.0 75.0 0 0 1 560 260 A75.0 75.0 0 0 0 560 110 Z" fill="#111111"/>
    <circle cx="560" cy="185.0" r="18.75" fill="#ffffff"/>
    <circle cx="560" cy="335.0" r="18.75" fill="#111111"/>
    <text x="560" y="465" font-size="19" font-weight="700" text-anchor="middle">Thái Cực — Đại Cực</text>
  </g>
</svg>
