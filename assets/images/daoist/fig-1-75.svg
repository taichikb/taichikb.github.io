<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Hình 1.75. Huấn luyện âm thanh và hơi thở bằng cách phóng khí vào một chậu nước</title>
  <desc id="desc">Hình người ngồi phóng Khí vào chậu nước với bốn bước: (1) Đầy Đan Điền Dưới, (2) Đầy Đan Điền Giữa, (3) Đầy Cổ Họng, (4) Phóng Âm Thanh Như Chùm Ánh Sáng. Toàn bộ nhãn bằng tiếng Việt.</desc>
  <rect width="1200" height="700" fill="#ffffff"/>
  <g font-family="Be Vietnam, Noto Sans, Arial, sans-serif" fill="#111111" stroke="none">
    <circle cx="360" cy="230" r="42" fill="#ffffff" stroke="#111111" stroke-width="2"/>
    <path d="M330 265 Q360 250 390 265 L400 420 L320 420 Z" fill="#ffffff" stroke="#111111" stroke-width="2"/>
    <path d="M400 300 Q480 320 560 340" fill="none" stroke="#111111" stroke-width="2"/>
    <path d="M390 350 Q470 370 550 360" fill="none" stroke="#111111" stroke-width="2"/>
    <ellipse cx="360" cy="360" rx="30" ry="45" fill="none" stroke="#111111" stroke-width="2"/>
    <ellipse cx="360" cy="450" rx="32" ry="40" fill="none" stroke="#111111" stroke-width="2"/>
    <ellipse cx="830" cy="390" rx="220" ry="45" fill="none" stroke="#111111" stroke-width="2"/>
    <path d="M610 390 Q830 470 1050 390" fill="none" stroke="#111111" stroke-width="2"/>
    <path d="M420 275 L820 380 M420 285 L820 390 M420 295 L820 400" fill="none" stroke="#111111" stroke-width="1.4"/>
    <line x1="600" y1="500" x2="1060" y2="500" stroke="#111111" stroke-width="3"/>
    <line x1="318" y1="360" x2="180" y2="360" stroke="#111111" stroke-width="1.4"/>
    <text x="20" y="354" font-size="15" font-weight="700" text-anchor="start">
<tspan x="20" dy="0">(1) Đầy Đan Điền Dưới</tspan>
</text>
    <line x1="318" y1="450" x2="180" y2="450" stroke="#111111" stroke-width="1.4"/>
    <text x="20" y="444" font-size="15" font-weight="700" text-anchor="start">
<tspan x="20" dy="0">(2) Đầy Đan Điền Giữa</tspan>
</text>
    <line x1="318" y1="230" x2="180" y2="230" stroke="#111111" stroke-width="1.4"/>
    <text x="20" y="224" font-size="15" font-weight="700" text-anchor="start">
<tspan x="20" dy="0">(3) Đầy Cổ Họng</tspan>
</text>
    <text x="20" y="114" font-size="15" font-weight="700" text-anchor="start">
<tspan x="20" dy="0">(4) Phóng Âm Thanh Như Chùm Ánh Sáng</tspan>
</text>
  </g>
</svg>
