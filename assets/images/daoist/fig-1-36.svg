<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" role="img" aria-labelledby="title desc">
  <title id="title">Hình 1.36. Sự hiểu biết của các đạo sĩ thời cổ về các Chuyển Hóa Tiên Thiên và Hậu Thiên</title>
  <desc id="desc">Hai sơ đồ: Tiên Thiên gồm Càn-Trời (Dương) ở trên nối qua vòng Tiên Thiên đến Khôn-Đất (Âm) ở dưới; Hậu Thiên gồm Ly-Hỏa ở trên nối qua vòng Hậu Thiên đến Khảm-Thủy ở dưới. Toàn bộ nhãn bằng tiếng Việt.</desc>
