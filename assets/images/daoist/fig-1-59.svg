<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Hình 1.59. Ba kỹ năng của sự huấn luyện nội công</title>
  <desc id="desc">Sơ đồ: Công Lực (Kỹ năng Sức Mạnh) dẫn tới Công Chuyển (Kỹ năng Đặc Thù), Nội Công (Kỹ năng Nội Tại) và Vị Công (Kỹ năng Ngoại Tại). Toàn bộ nhãn bằng tiếng Việt.</desc>
  <rect width="900" height="520" fill="#ffffff"/>
  <g font-family="Be Vietnam, Noto Sans, Arial, sans-serif" fill="#111111" stroke="none">
    <rect x="40" y="215" width="200" height="90" fill="#ffffff" stroke="#111111" stroke-width="1.6"/>
    <text x="140" y="265" font-size="17" font-weight="700" text-anchor="middle">
<tspan x="140" dy="0">Công Lực
(Kỹ năng Sức Mạnh)</tspan>
</text>
    <path d="M240 260 C300 260 300 100 360 100" fill="none" stroke="#111111" stroke-width="1.8"/>
    <rect x="360" y="55" width="340" height="90" fill="#ffffff" stroke="#111111" stroke-width="1.6"/>
    <text x="530" y="105" font-size="17" font-weight="700" text-anchor="middle">
<tspan x="530" dy="0">Công Chuyển
(Kỹ năng Đặc Thù)</tspan>
</text>
    <path d="M240 260 C300 260 300 260 360 260" fill="none" stroke="#111111" stroke-width="1.8"/>
    <rect x="360" y="215" width="340" height="90" fill="#ffffff" stroke="#111111" stroke-width="1.6"/>
    <text x="530" y="265" font-size="17" font-weight="700" text-anchor="middle">
<tspan x="530" dy="0">Nội Công
(Kỹ năng Nội Tại)</tspan>
</text>
    <path d="M240 260 C300 260 300 420 360 420" fill="none" stroke="#111111" stroke-width="1.8"/>
    <rect x="360" y="375" width="340" height="90" fill="#ffffff" stroke="#111111" stroke-width="1.6"/>
    <text x="530" y="425" font-size="17" font-weight="700" text-anchor="middle">
<tspan x="530" dy="0">Vị Công
(Kỹ năng Ngoại Tại)</tspan>
</text>
  </g>
</svg>
