name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.pages_url.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # ---------------------------------------------------------------------------
      # GitHub Pages rejects artifacts over 1 GB, and this site is ~8.4 GB on disk.
      # Most bulk binaries live in the taichikb/taichinow-media repo and are
      # referenced from the HTML by absolute raw.githubusercontent.com URLs, so
      # they do not need to be in the Pages artifact:
      #   books/pdfs          (~5.0 GB) offloaded; links rewritten to absolute URLs
      #   assets/books        (~2.2 GB) offloaded; referenced only by absolute URLs
      #   assets/images/books (~0.9 GB) offloaded; 24.5k img/href refs rewritten
      #   downloads           (~0.02 GB) unreferenced A5 PDFs
      #   assets/images/*     the ~0.44 GB subset in .github/pages-media-exclude.txt:
      #                       files that NO page references, so dropping them is free
      # assets/pdf/ (~0.59 GB) is ALSO offloaded: the reader pages now embed the
      # PDFs from taichikb/taichinow-media via absolute raw.githubusercontent.com
      # URLs (pdf.js works cross-origin: ACAO:* + 206 Range). So assets/pdf/ is
      # added to the exclude list below, dropping the artifact to ~0.49 GB and
      # clearing the 1 GB Pages cap. Everything else stays excluded.
      # NOTE: tar is used rather than rsync, which is not guaranteed on the runner.
      # ---------------------------------------------------------------------------
      - name: Stage site (exclude offloaded media)
        run: |
          set -eu
          mkdir -p _site
          # Build the exclusion list: the fully-offloaded trees plus the
          # referenced-by-nothing images enumerated in the checked-in manifest.
          : > /tmp/exclude.txt
          printf '%s\n' "./.git" "./.github" "./assets/books" "./books/pdfs" \
            "./assets/images/books" "./assets/pdf" "./downloads" "./_site" >> /tmp/exclude.txt
          if [ -f .github/pages-media-exclude.txt ]; then
            # manifest lines are repo-relative (assets/images/...) -> prefix "./"
            sed -e 's/^/.\//' -e '/^\.\/$/d' .github/pages-media-exclude.txt >> /tmp/exclude.txt
          fi
          echo "Exclusion entries: $(wc -l < /tmp/exclude.txt)"
          tar --exclude-from=/tmp/exclude.txt -cf - . | tar -xf - -C _site
          # GitHub Pages rejects artifacts over 1 GB. All large binaries
          # (assets/pdf/ included) are now excluded, so the artifact should sit
          # well under the cap. Keep this guard as a hard safety net.
          SIZE_MB=$(du -sm _site | cut -f1)
          echo "Staged artifact size: ${SIZE_MB} MB"
          if [ "$SIZE_MB" -gt 985 ]; then
            echo "::error::Pages artifact is ${SIZE_MB} MB — over the 985 MB safety margin (hard cap 1 GB). Find more unreferenced files to exclude." >&2
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      # ---------------------------------------------------------------------------
      # actions/deploy-pages@v4 hard-clamps its `timeout` input to 600000 ms
      # (10 minutes) and CANCELS the Pages deployment when that cap is hit.
      # The staged artifact here is ~619 MB, so when the Pages backend is
      # congested the `deployment_queued` / `updating_pages` phases can outlast
      # 10 minutes. Runs 42229615784, 42236333575, 42249511875 and 42252334528
      # all failed exactly 10m after the step started; run 42243539112 succeeded
      # on a plain retry in 9m34s. Raising `timeout` has NO effect (it is
      # clamped), and `gh run rerun` / `workflow_dispatch` need repo admin rights
      # that the publishing token does not have.
      #
      # So make retries self-contained: up to three independent 10-minute deploy
      # attempts against the SAME already-uploaded artifact, in this one job.
      # Skipped attempts report outcome `skipped`; the final step fails the job
      # only if none of the three succeeded.
      # ---------------------------------------------------------------------------
      - name: Deploy to GitHub Pages (attempt 1)
        id: deployment1
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Pause before retry 2
        if: steps.deployment1.outcome == 'failure'
        run: sleep 30

      - name: Deploy to GitHub Pages (attempt 2)
        id: deployment2
        if: steps.deployment1.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Pause before retry 3
        if: steps.deployment1.outcome == 'failure' && steps.deployment2.outcome == 'failure'
        run: sleep 30

      - name: Deploy to GitHub Pages (attempt 3)
        id: deployment3
        if: steps.deployment1.outcome == 'failure' && steps.deployment2.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Pages deploy outcome
        id: pages_url
        if: always()
        env:
          A1: ${{ steps.deployment1.outcome }}
          A2: ${{ steps.deployment2.outcome }}
          A3: ${{ steps.deployment3.outcome }}
        run: |
          echo "attempt1=$A1 attempt2=$A2 attempt3=$A3"
          if [ "$A1" = success ] || [ "$A2" = success ] || [ "$A3" = success ]; then
            echo "page_url=https://taichikb.github.io/" >> "$GITHUB_OUTPUT"
            echo "At least one Pages deploy attempt succeeded"
          else
            echo "::error::All three Pages deploy attempts hit the 10-minute cap"
            exit 1
          fi
