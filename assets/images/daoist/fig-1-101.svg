<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc">
  <title id="title">Hình 1.101. "Lăn Mắt Để Xua Hỏa" — Nhắm mắt lại và xoay chúng xuống, sang trái, lên trên và sang phải</title>
  <desc id="desc">Sơ đồ bốn hướng chuyển động của mắt theo vòng tròn: (1) Xuống, (2) Trái, (3) Lên, (4) Phải — dùng để kích thích và khởi động Huyền Quan. Toàn bộ nhãn bằng tiếng Việt.</desc>
  <rect width="1000" height="620" fill="#ffffff"/>
  <g font-family="Be Vietnam, Noto Sans, Arial, sans-serif" fill="#111111" stroke="none">
    <ellipse cx="500" cy="300" rx="340" ry="150" fill="none" stroke="#111111" stroke-width="1.8" stroke-dasharray="8 6"/>
    <ellipse cx="500" cy="450" rx="45" ry="18" fill="#ffffff" stroke="#111111" stroke-width="2"/>
    <circle cx="500" cy="450" r="7" fill="#111111"/>
    <text x="500" y="492" font-size="16" font-weight="700" text-anchor="middle">(1) Xuống</text>
    <ellipse cx="840" cy="300" rx="45" ry="18" fill="#ffffff" stroke="#111111" stroke-width="2"/>
    <circle cx="840" cy="300" r="7" fill="#111111"/>
    <text x="840" y="270" font-size="16" font-weight="700" text-anchor="end">(2) Trái</text>
    <ellipse cx="500" cy="150" rx="45" ry="18" fill="#ffffff" stroke="#111111" stroke-width="2"/>
    <circle cx="500" cy="150" r="7" fill="#111111"/>
    <text x="500" y="120" font-size="16" font-weight="700" text-anchor="middle">(3) Lên</text>
    <ellipse cx="160" cy="300" rx="45" ry="18" fill="#ffffff" stroke="#111111" stroke-width="2"/>
    <circle cx="160" cy="300" r="7" fill="#111111"/>
    <text x="160" y="270" font-size="16" font-weight="700" text-anchor="middle">(4) Phải</text>
    <path d="M190 260 Q500 125 810 260" fill="none" stroke="#111111" stroke-width="1.8" marker-end="url(#a101)"/>
    <path d="M810 340 Q500 475 190 340" fill="none" stroke="#111111" stroke-width="1.8" marker-end="url(#a101)"/>
    <defs><marker id="a101" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#111111"/></marker></defs>
    <text x="500" y="590" font-size="15" font-weight="700" text-anchor="middle">Nhắm mắt và xoay xuống, trái, lên, phải — kích hoạt Huyền Quan</text>
  </g>
</svg>
