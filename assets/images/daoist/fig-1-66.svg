  <title id="title">Hình 1.66. Gập hông (nhanh chóng xoay hông sang một bên — rồi lập tức hạ cột sống xuống)</title>
  <desc id="desc">Hình minh họa động tác Gập Hông: tay phải đưa về trước, chân phải ở sau, các vòng xoắn năng lượng biểu thị sự xoay hông và hạ cột sống. Toàn bộ nhãn bằng tiếng Việt.</desc>
