<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" role="img" aria-labelledby="title desc">
  <title id="title">Hình 1.35. Hình tướng năng lượng luôn biến đổi của Bốn Giai Đoạn</title>
  <desc id="desc">Biểu đồ Thái Cực với bốn giai đoạn: Dương phát triển, Dương cực thịnh, Âm phát triển, Âm cực thịnh, được chú thích bằng tiếng Việt.</desc>
  <rect width="900" height="700" fill="#ffffff"/>
  <g font-family="Be Vietnam, Noto Sans, Arial, sans-serif" fill="#111111" stroke="none">
    <!-- Central taiji symbol: four energy phases -->
    <g transform="translate(450 350)">
      <circle r="170" fill="#ffffff" stroke="#111111" stroke-width="3"/>
      <!-- Four energy quadrants, clipped to the circle -->
      <defs>
        <clipPath id="taiji-clip"><circle r="170"/></clipPath>
      </defs>
      <g clip-path="url(#taiji-clip)">
        <rect x="0" y="-170" width="170" height="170" fill="#111111"/>
        <rect x="-170" y="0" width="170" height="170" fill="#111111"/>
        <line x1="0" y1="-170" x2="0" y2="170" stroke="#111111" stroke-width="2" stroke-dasharray="7 7"/>
        <line x1="-170" y1="0" x2="170" y2="0" stroke="#111111" stroke-width="2" stroke-dasharray="7 7"/>
        <!-- upper-left: two dark bars -->
        <g stroke="#111111" stroke-width="7" stroke-linecap="square">
          <line x1="-105" y1="-92" x2="-55" y2="-92"/>
          <line x1="-105" y1="-70" x2="-55" y2="-70"/>
        </g>
        <!-- upper-right: three light bars -->
        <g stroke="#ffffff" stroke-width="7" stroke-linecap="square">
          <line x1="55" y1="-105" x2="105" y2="-105"/>
          <line x1="55" y1="-85" x2="105" y2="-85"/>
          <line x1="55" y1="-65" x2="105" y2="-65"/>
        </g>
        <!-- lower-left: three light bars -->
        <g stroke="#ffffff" stroke-width="7" stroke-linecap="square">
          <line x1="-105" y1="65" x2="-55" y2="65"/>
          <line x1="-105" y1="85" x2="-55" y2="85"/>
          <line x1="-105" y1="105" x2="-55" y2="105"/>
        </g>
        <!-- lower-right: two dark bars -->
        <g stroke="#111111" stroke-width="7" stroke-linecap="square">
          <line x1="55" y1="70" x2="105" y2="70"/>
          <line x1="55" y1="92" x2="105" y2="92"/>
        </g>
        <circle cx="0" cy="-52" r="8" fill="#111111"/>
        <circle cx="0" cy="52" r="8" fill="#ffffff" stroke="#111111" stroke-width="2"/>
      </g>
      <circle r="170" fill="none" stroke="#111111" stroke-width="3"/>
    </g>

    <!-- Cardinal labels -->
    <g font-size="24" font-weight="600" text-anchor="middle">
      <text x="450" y="78">Ngọ — Giữa trưa</text>
      <text x="450" y="108" font-weight="400">(Tâm – Hỏa)</text>

      <text x="640" y="335" text-anchor="start">Dậu — Hoàng hôn</text>
      <text x="640" y="365" text-anchor="start" font-weight="400">(Phế – Kim)</text>

      <text x="450" y="648">Tý — Nửa đêm</text>
      <text x="450" y="678" font-weight="400">(Thận – Thủy)</text>

      <text x="260" y="335" text-anchor="end">Mão — Bình minh</text>
      <text x="260" y="365" text-anchor="end" font-weight="400">(Can – Mộc)</text>
    </g>

    <!-- Four stage boxes -->
    <g font-size="21" stroke="#111111" fill="none" stroke-width="2">
      <rect x="20" y="150" width="230" height="110" rx="4"/>
      <rect x="650" y="150" width="230" height="110" rx="4"/>
      <rect x="20" y="440" width="230" height="110" rx="4"/>
      <rect x="650" y="440" width="230" height="110" rx="4"/>
    </g>
    <g font-size="20" fill="#111111" stroke="none">
      <text x="135" y="180" text-anchor="middle" font-weight="700">(2) Giai đoạn thứ hai</text>
      <text x="135" y="208" text-anchor="middle">của sự sống:</text>
      <text x="135" y="236" text-anchor="middle">Dương cực thịnh</text>

      <text x="765" y="180" text-anchor="middle" font-weight="700">(3) Giai đoạn thứ ba</text>
      <text x="765" y="208" text-anchor="middle">của sự sống:</text>
      <text x="765" y="236" text-anchor="middle">Âm phát triển</text>

      <text x="135" y="470" text-anchor="middle" font-weight="700">(1) Giai đoạn đầu</text>
      <text x="135" y="498" text-anchor="middle">của sự sống:</text>
      <text x="135" y="526" text-anchor="middle">Dương phát triển</text>

      <text x="765" y="470" text-anchor="middle" font-weight="700">(4) Giai đoạn thứ tư</text>
      <text x="765" y="498" text-anchor="middle">của sự sống:</text>
      <text x="765" y="526" text-anchor="middle">Âm cực thịnh</text>
    </g>

    <!-- Connector lines from boxes to the symbol -->
    <g stroke="#111111" stroke-width="1.5" fill="none" stroke-dasharray="5 5">
      <line x1="250" y1="205" x2="315" y2="275"/>
      <line x1="650" y1="205" x2="585" y2="275"/>
      <line x1="250" y1="495" x2="315" y2="425"/>
      <line x1="650" y1="495" x2="585" y2="425"/>
    </g>
  </g>
</svg>
