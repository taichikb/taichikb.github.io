<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 760" role="img" aria-labelledby="title desc">
  <title id="title">Hình 1.4. Nghiên cứu Ma Thuật Cấp Thấp Đạo Giáo — Tu Dưỡng Bên Ngoài</title>
  <desc id="desc">Sơ đồ cây: Nghiên cứu Ma Thuật Cấp Thấp (Ngoại Đan) hấp thụ và chuyển hóa Tinh, Khí, Thần của Thiên thể, Thời tiết, Con người, Đất, Động vật, Thực vật và Khoáng vật. Toàn bộ nhãn bằng tiếng Việt.</desc>
  <rect width="1300" height="760" fill="#ffffff"/>
  <g font-family="Be Vietnam, Noto Sans, Arial, sans-serif" fill="#111111">
    <rect x="20" y="300" width="250" height="110" rx="3" fill="none" stroke="#111111" stroke-width="2.5"/>
    <text x="145" y="345" text-anchor="middle" font-size="23" font-weight="700">Nghiên cứu Ma Thuật</text>
    <text x="145" y="375" text-anchor="middle" font-size="23" font-weight="700">Cấp Thấp Đạo Giáo</text>
    <text x="145" y="402" text-anchor="middle" font-size="19" font-style="italic">(Ngoại Đan)</text>

    <g stroke="#111111" stroke-width="1.6" fill="none">
      <line x1="270" y1="355" x2="380" y2="70"/>
      <line x1="270" y1="355" x2="380" y2="168"/>
      <line x1="270" y1="355" x2="380" y2="266"/>
      <line x1="270" y1="355" x2="380" y2="364"/>
      <line x1="270" y1="355" x2="380" y2="462"/>
      <line x1="270" y1="355" x2="380" y2="560"/>
      <line x1="270" y1="355" x2="380" y2="658"/>
    </g>

    <g font-size="19" font-weight="600">
      <rect x="380" y="28" width="410" height="84" rx="2" fill="none" stroke="#111111" stroke-width="2"/>
      <text x="390" y="58">Hấp thụ &amp; chuyển hóa Tinh, Khí, Thần</text>
      <text x="390" y="86">của các Thiên thể</text>

      <rect x="380" y="126" width="410" height="84" rx="2" fill="none" stroke="#111111" stroke-width="2"/>
      <text x="390" y="156">Hấp thụ &amp; chuyển hóa Tinh, Khí, Thần</text>
      <text x="390" y="184">của Thời tiết</text>

      <rect x="380" y="224" width="410" height="84" rx="2" fill="none" stroke="#111111" stroke-width="2"/>
      <text x="390" y="254">Hấp thụ &amp; chuyển hóa Tinh, Khí, Thần</text>
      <text x="390" y="282">của Con người</text>

      <rect x="380" y="322" width="410" height="84" rx="2" fill="none" stroke="#111111" stroke-width="2"/>
      <text x="390" y="352">Hấp thụ &amp; chuyển hóa Tinh, Khí, Thần</text>
      <text x="390" y="380">của Đất</text>

      <rect x="380" y="420" width="410" height="84" rx="2" fill="none" stroke="#111111" stroke-width="2"/>
      <text x="390" y="450">Hấp thụ &amp; chuyển hóa Tinh, Khí, Thần</text>
      <text x="390" y="478">của Động vật</text>

      <rect x="380" y="518" width="410" height="84" rx="2" fill="none" stroke="#111111" stroke-width="2"/>
      <text x="390" y="548">Hấp thụ &amp; chuyển hóa Tinh, Khí, Thần</text>
      <text x="390" y="576">của Thực vật</text>

      <rect x="380" y="616" width="410" height="84" rx="2" fill="none" stroke="#111111" stroke-width="2"/>
      <text x="390" y="646">Hấp thụ &amp; chuyển hóa Tinh, Khí, Thần</text>
      <text x="390" y="674">của Khoáng vật</text>
    </g>

    <g stroke="#111111" stroke-width="1.6" fill="none">
      <line x1="790" y1="70" x2="860" y2="70"/>
      <line x1="790" y1="168" x2="860" y2="168"/>
      <line x1="790" y1="266" x2="860" y2="266"/>
      <line x1="790" y1="364" x2="860" y2="364"/>
      <line x1="790" y1="462" x2="860" y2="462"/>
      <line x1="790" y1="560" x2="860" y2="560"/>
      <line x1="790" y1="658" x2="860" y2="658"/>
    </g>

    <g font-size="17">
      <rect x="860" y="30" width="420" height="80" rx="2" fill="none" stroke="#111111" stroke-width="2"/>
      <text x="872" y="58">Thu thập qua sự hấp thụ năng lượng</text>
      <text x="872" y="84">của Mặt Trời, Mặt Trăng, các Hành Tinh và Tinh Tú</text>

      <rect x="860" y="128" width="420" height="80" rx="2" fill="none" stroke="#111111" stroke-width="2"/>
      <text x="872" y="156">Thu thập qua sự hấp thụ năng lượng</text>
      <text x="872" y="182">của mây, gió, mưa, sấm và sét</text>

      <rect x="860" y="226" width="420" height="80" rx="2" fill="none" stroke="#111111" stroke-width="2"/>
      <text x="872" y="254">Thu thập qua Tu luyện Tình dục</text>
      <text x="872" y="280">và thực hành Hấp thụ Năng lượng</text>

      <rect x="860" y="324" width="420" height="80" rx="2" fill="none" stroke="#111111" stroke-width="2"/>
      <text x="872" y="352">Thu thập qua Phong Thủy huyền môn</text>
      <text x="872" y="378">(Năng lượng của Gió, Nước và Thổ nhưỡng)</text>

      <rect x="860" y="422" width="420" height="80" rx="2" fill="none" stroke="#111111" stroke-width="2"/>
      <text x="872" y="450">Thu thập qua sự hấp thụ xương, gân, thịt,</text>
      <text x="872" y="476">máu, tinh, khí và thần của động vật</text>

      <rect x="860" y="520" width="420" height="80" rx="2" fill="none" stroke="#111111" stroke-width="2"/>
      <text x="872" y="548">Thu thập qua sự hấp thụ rễ, thân, lá, hoa,</text>
      <text x="872" y="574">phấn hoa, khí và thần của thực vật</text>

      <rect x="860" y="618" width="420" height="80" rx="2" fill="none" stroke="#111111" stroke-width="2"/>
      <text x="872" y="646">Thu thập qua sự hấp thụ bột khoáng, thuốc,</text>
      <text x="872" y="672">thuốc tiên, dầu và năng lượng</text>
    </g>
  </g>
</svg>
