<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 780" role="img" aria-labelledby="title desc">
  <title id="title">Hình 1.50. Bốn Con Số Dương ở trung tâm của Phương Đình liên hệ đến sự tròn khuyết của sức nóng và ánh mặt trời, cùng bốn mùa trong năm</title>
  <desc id="desc">Phương Đình Lạc Hà: các vòng tròn mang số 4-9-2 / 3-5-7 / 8-1-6, với số chẵn dương ở giữa các cạnh; các nhãn hướng Nam-Bắc-Đông-Tây và Hạ Chí, Đông Chí, Xuân Phân, Thu Phân. Toàn bộ nhãn bằng tiếng Việt.</desc>
  <rect width="1000" height="780" fill="#ffffff"/>
  <g font-family="Be Vietnam, Noto Sans, Arial, sans-serif" fill="#111111" stroke="none">
    <!-- diagonal season labels -->
    <g font-size="18" font-weight="700">
      <text x="155" y="165" transform="rotate(-40 155 165)">Xuân Phân (Ánh sáng yếu lúc bình minh)</text>
      <text x="845" y="165" transform="rotate(40 845 165)">Thu Phân (Ánh sáng yếu lúc hoàng hôn)</text>
      <text x="155" y="640" transform="rotate(40 155 640)">Đông (Âm suy - Dương trưởng)</text>
      <text x="845" y="640" transform="rotate(-40 845 640)">Tây (Dương suy - Âm trưởng)</text>
    </g>
    <!-- central square -->
    <rect x="290" y="210" width="420" height="420" fill="none" stroke="#111111" stroke-width="2"/>
    <!-- nine circles -->
    <g fill="#ffffff" stroke="#111111" stroke-width="2">
      <circle cx="375" cy="295" r="45"/><circle cx="500" cy="295" r="45"/><circle cx="625" cy="295" r="45"/>
      <circle cx="375" cy="420" r="45"/><circle cx="500" cy="420" r="45"/><circle cx="625" cy="420" r="45"/>
      <circle cx="375" cy="545" r="45"/><circle cx="500" cy="545" r="45"/><circle cx="625" cy="545" r="45"/>
    </g>
    <!-- central column, middle row, and corner odd circles are white; even numbers at centers of edges -->
    <g fill="#ffffff" stroke="#111111" stroke-width="2">
      <circle cx="500" cy="295" r="45"/><circle cx="375" cy="420" r="45"/><circle cx="625" cy="420" r="45"/>
      <circle cx="500" cy="420" r="45"/><circle cx="500" cy="545" r="45"/>
    </g>
    <g font-size="32" font-weight="700" text-anchor="middle">
      <text x="375" y="307">4</text><text x="500" y="307">9</text><text x="625" y="307">2</text>
      <text x="375" y="432">3</text><text x="500" y="432">5</text><text x="625" y="432">7</text>
      <text x="375" y="557">8</text><text x="500" y="557">1</text><text x="625" y="557">6</text>
    </g>
    <!-- top and bottom labels -->
    <g font-size="19" font-weight="700" text-anchor="middle">
      <text x="500" y="110">Nam (Dương Cực)</text>
      <text x="500" y="140">Hạ Chí (Nhiệt Cao - Ánh Sáng Cao)</text>
      <text x="500" y="690">Bắc (Âm Cực)</text>
      <text x="500" y="720">Đông Chí (Nhiệt Thấp - Ánh Sáng Yếu)</text>
    </g>
  </g>
</svg>
