<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Hình 1.90. Giai đoạn "An Trú Và Tăng Cường Thần" được chia thành bốn bước chính</title>
  <desc id="desc">Sơ đồ: Bốn Giai Đoạn của "An Trú và Tăng Cường Thần" dẫn tới #1 Giữ gìn và Bảo vệ Thần, #2 Làm Đặc Thần, #3 Ổn Định và Làm Dịu Thần, #4 Tập Trung, Tinh Luyện, Định Tâm và Tăng Cường Thần. Toàn bộ nhãn bằng tiếng Việt.</desc>
  <rect width="1200" height="620" fill="#ffffff"/>
  <g font-family="Be Vietnam, Noto Sans, Arial, sans-serif" fill="#111111" stroke="none">
    <rect x="40" y="240" width="300" height="130" fill="#ffffff" stroke="#111111" stroke-width="1.6"/>
    <text x="190.0" y="270" font-size="16" font-weight="700" text-anchor="middle">Bốn Giai Đoạn Của</text>
    <text x="190.0" y="291" font-size="16" font-weight="700" text-anchor="middle">"An Trú Và Tăng</text>
    <text x="190.0" y="312" font-size="16" font-weight="700" text-anchor="middle">Cường Thần"</text>
    <path d="M340 305 C440 305 440 75 540 75" fill="none" stroke="#111111" stroke-width="1.5"/>
    <rect x="540" y="30" width="620" height="90" fill="#ffffff" stroke="#111111" stroke-width="1.6"/>
    <text x="850.0" y="60" font-size="15" font-weight="700" text-anchor="middle">#1 Giữ Gìn Và Bảo Vệ Thần</text>
    <path d="M340 305 C440 305 440 215 540 215" fill="none" stroke="#111111" stroke-width="1.5"/>
    <rect x="540" y="170" width="620" height="90" fill="#ffffff" stroke="#111111" stroke-width="1.6"/>
    <text x="850.0" y="200" font-size="15" font-weight="700" text-anchor="middle">#2 Làm Đặc Thần</text>
    <path d="M340 305 C440 305 440 355 540 355" fill="none" stroke="#111111" stroke-width="1.5"/>
    <rect x="540" y="310" width="620" height="90" fill="#ffffff" stroke="#111111" stroke-width="1.6"/>
    <text x="850.0" y="340" font-size="15" font-weight="700" text-anchor="middle">#3 Ổn Định Và Làm Dịu Thần</text>
    <path d="M340 305 C440 305 440 495 540 495" fill="none" stroke="#111111" stroke-width="1.5"/>
    <rect x="540" y="450" width="620" height="90" fill="#ffffff" stroke="#111111" stroke-width="1.6"/>
    <text x="850.0" y="480" font-size="15" font-weight="700" text-anchor="middle">#4 Tập Trung, Tinh Luyện, Định Tâm Và Tăng Cường Thần</text>
  </g>
</svg>
