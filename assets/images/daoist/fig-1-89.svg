<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 480" role="img" aria-labelledby="title desc">
  <title id="title">Hình 1.89. Quyền năng ma thuật được phản chiếu bên trong nguyên thần của người đệ tử</title>
  <desc id="desc">Ba vòng tròn biểu thị Vòng Ánh Sáng Khiếm Khuyết (tối ở giữa), Vòng Ánh Sáng Khỏe Mạnh (trống rỗng), và Vòng Ánh Sáng Quyền Năng (nhiều vòng đồng tâm). Toàn bộ nhãn bằng tiếng Việt.</desc>
  <rect width="1100" height="480" fill="#ffffff"/>
  <g font-family="Be Vietnam, Noto Sans, Arial, sans-serif" fill="#111111" stroke="none">
    <rect x="20" y="20" width="1060" height="440" fill="#ffffff" stroke="#111111" stroke-width="1.6"/>
    <circle cx="200" cy="200" r="85" fill="#ffffff" stroke="#111111" stroke-width="2"/>
    <circle cx="200" cy="200" r="48" fill="#111111"/>
    <text x="200" y="335" font-size="16" font-weight="700" text-anchor="middle">Vòng Ánh Sáng</text>
    <text x="200" y="360" font-size="16" font-weight="700" text-anchor="middle">Khiếm Khuyết</text>
    <circle cx="550" cy="200" r="85" fill="#ffffff" stroke="#111111" stroke-width="2"/>
    <text x="550" y="335" font-size="16" font-weight="700" text-anchor="middle">Vòng Ánh Sáng</text>
    <text x="550" y="360" font-size="16" font-weight="700" text-anchor="middle">Khỏe Mạnh</text>
    <circle cx="900" cy="200" r="85" fill="#ffffff" stroke="#111111" stroke-width="2"/>
    <circle cx="900" cy="200" r="68" fill="none" stroke="#111111" stroke-width="2"/>
    <circle cx="900" cy="200" r="51" fill="none" stroke="#111111" stroke-width="2"/>
    <circle cx="900" cy="200" r="34" fill="none" stroke="#111111" stroke-width="2"/>
    <circle cx="900" cy="200" r="17" fill="none" stroke="#111111" stroke-width="2"/>
    <text x="900" y="335" font-size="16" font-weight="700" text-anchor="middle">Vòng Ánh Sáng</text>
    <text x="900" y="360" font-size="16" font-weight="700" text-anchor="middle">Quyền Năng</text>
  </g>
</svg>
