<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1650 620" role="img" aria-labelledby="title desc">
  <title id="title">Hình 1.39. Các giai đoạn của Chuyển Hóa Năng Lượng hình thành nên Thân Thể Con Người</title>
  <desc id="desc">Sơ đồ từ Đạo qua Vô Cực, Thái Cực Cực, Ngũ Quang Thuần Kính, Ngũ Hành Dương/Âm, Khí Hỏa và Khí Thủy, đến Thần-Khí-Tinh và Vạn Vật (Hệ Tạng Căn Bản). Toàn bộ nhãn bằng tiếng Việt.</desc>
