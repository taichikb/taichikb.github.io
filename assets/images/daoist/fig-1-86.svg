<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Hình 1.86. Những chuyển biến giả kim tiên thiên và hậu thiên của tinh (Jing), khí (Qi) và thần (Shen)</title>
  <desc id="desc">Hai cột song song: Chuyển biến Tiên Thiên (Đạo, Vô Cực, Nguyên Thần, Nguyên Khí, Nguyên Tinh) và Chuyển biến Hậu Thiên (Cha Mẹ, Tiềm thức, Thần, Khí, Tinh). Toàn bộ nhãn bằng tiếng Việt.</desc>
  <rect width="1200" height="800" fill="#ffffff"/>
  <g font-family="Be Vietnam, Noto Sans, Arial, sans-serif" fill="#111111" stroke="none">
    <rect x="40" y="30" width="540" height="112" fill="#ffffff" stroke="#111111" stroke-width="1.6"/>
    <text x="52" y="60" font-size="15" font-weight="700" text-anchor="start">
<tspan x="52" dy="0">Chuyển biến Năng lượng Tiên Thiên</tspan>
</text>
    <line x1="310" y1="142" x2="310" y2="155" stroke="#111111" stroke-width="1.5"/>
    <rect x="40" y="155" width="540" height="112" fill="#ffffff" stroke="#111111" stroke-width="1.6"/>
    <text x="52" y="185" font-size="15" font-weight="400" text-anchor="start">
<tspan x="52" dy="0">Đạo: Con Đường của Thần Linh</tspan>
</text>
    <line x1="310" y1="267" x2="310" y2="280" stroke="#111111" stroke-width="1.5"/>
    <rect x="40" y="280" width="540" height="112" fill="#ffffff" stroke="#111111" stroke-width="1.6"/>
    <text x="52" y="310" font-size="15" font-weight="400" text-anchor="start">
<tspan x="52" dy="0">Vô Cực: Không Gian Vô Hạn (Khoảng Không Vô Hình)</tspan>
</text>
    <line x1="310" y1="392" x2="310" y2="405" stroke="#111111" stroke-width="1.5"/>
    <rect x="40" y="405" width="540" height="112" fill="#ffffff" stroke="#111111" stroke-width="1.6"/>
    <text x="52" y="435" font-size="15" font-weight="400" text-anchor="start">
<tspan x="52" dy="0">Nguyên Thần: Thần Nguyên Thủy (Hiện hữu trước khi</tspan>
<tspan x="52" dy="19">sinh) — Nhận thức và Trực giác (Đức hạnh của Ngũ</tspan>
<tspan x="52" dy="19">Hành)</tspan>
</text>
    <line x1="310" y1="517" x2="310" y2="530" stroke="#111111" stroke-width="1.5"/>
    <rect x="40" y="530" width="540" height="112" fill="#ffffff" stroke="#111111" stroke-width="1.6"/>
    <text x="52" y="560" font-size="15" font-weight="400" text-anchor="start">
<tspan x="52" dy="0">Nguyên Khí: Năng Lượng Nguyên Thủy (của Đạo) — Trải</tspan>
<tspan x="52" dy="19">dài đến và từ không gian vô hạn của Vô Cực</tspan>
</text>
    <line x1="310" y1="642" x2="310" y2="655" stroke="#111111" stroke-width="1.5"/>
    <rect x="40" y="655" width="540" height="112" fill="#ffffff" stroke="#111111" stroke-width="1.6"/>
    <text x="52" y="685" font-size="15" font-weight="400" text-anchor="start">
<tspan x="52" dy="0">Nguyên Tinh: Bản Chất Nguyên Thủy — Quyết định Hình</tspan>
<tspan x="52" dy="19">Thể, Sức Mạnh và Sinh Lực</tspan>
</text>
    <rect x="620" y="30" width="540" height="112" fill="#ffffff" stroke="#111111" stroke-width="1.6"/>
    <text x="632" y="60" font-size="15" font-weight="700" text-anchor="start">
<tspan x="632" dy="0">Chuyển biến Năng lượng Hậu Thiên</tspan>
</text>
    <line x1="890" y1="142" x2="890" y2="155" stroke="#111111" stroke-width="1.5"/>
    <rect x="620" y="155" width="540" height="112" fill="#ffffff" stroke="#111111" stroke-width="1.6"/>
    <text x="632" y="185" font-size="15" font-weight="400" text-anchor="start">
<tspan x="632" dy="0">Cha Mẹ: Đấng Tối Cao</tspan>
</text>
    <line x1="890" y1="267" x2="890" y2="280" stroke="#111111" stroke-width="1.5"/>
    <rect x="620" y="280" width="540" height="112" fill="#ffffff" stroke="#111111" stroke-width="1.6"/>
    <text x="632" y="310" font-size="15" font-weight="400" text-anchor="start">
<tspan x="632" dy="0">Tiềm thức Hậu Thiên: Các Khuôn Mẫu và Tín Ngưỡng Ăn</tspan>
<tspan x="632" dy="19">Sâu</tspan>
</text>
    <line x1="890" y1="392" x2="890" y2="405" stroke="#111111" stroke-width="1.5"/>
    <rect x="620" y="405" width="540" height="112" fill="#ffffff" stroke="#111111" stroke-width="1.6"/>
    <text x="632" y="435" font-size="15" font-weight="400" text-anchor="start">
<tspan x="632" dy="0">Thần Hậu Thiên: Thần Đắc Được — Tư duy Nhận thức và</tspan>
<tspan x="632" dy="19">Phóng chiếu Cảm xúc</tspan>
</text>
    <line x1="890" y1="517" x2="890" y2="530" stroke="#111111" stroke-width="1.5"/>
    <rect x="620" y="530" width="540" height="112" fill="#ffffff" stroke="#111111" stroke-width="1.6"/>
    <text x="632" y="560" font-size="15" font-weight="400" text-anchor="start">
<tspan x="632" dy="0">Khí Hậu Thiên: Khí Đắc Được — Thu được từ thực phẩm,</tspan>
<tspan x="632" dy="19">không khí và nước</tspan>
</text>
    <line x1="890" y1="642" x2="890" y2="655" stroke="#111111" stroke-width="1.5"/>
    <rect x="620" y="655" width="540" height="112" fill="#ffffff" stroke="#111111" stroke-width="1.6"/>
    <text x="632" y="685" font-size="15" font-weight="400" text-anchor="start">
<tspan x="632" dy="0">Tinh Hậu Thiên: Tinh Sinh Dục Sinh Sản</tspan>
</text>
  </g>
</svg>
