<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 780" role="img" aria-labelledby="title desc">
  <title id="title">Hình 1.45. Biểu Đồ Hoàng Hà (Hetu)</title>
  <desc id="desc">Biểu đồ Hoàng Hà: bốn cổng (Đất, Con Người, Ma Quỷ, Trời), bốn hướng Nam-Hỏa, Bắc-Thủy, Đông-Mộc, Tây-Kim với các số 6 đến 9, và vòng Nguyên Khí, Nguyên Tinh, Nguyên Thần quanh số 5 trung tâm. Toàn bộ nhãn bằng tiếng Việt.</desc>
  <rect width="1100" height="780" fill="#ffffff"/>
  <g font-family="Be Vietnam, Noto Sans, Arial, sans-serif" fill="#111111" stroke="none">
    <!-- four doors -->
    <g stroke="#111111" stroke-width="1.6" fill="#ffffff">
      <rect x="60" y="70" width="150" height="62"/>
      <rect x="890" y="70" width="150" height="62"/>
      <rect x="60" y="640" width="150" height="62"/>
      <rect x="890" y="640" width="150" height="62"/>
    </g>
    <g font-size="18" font-weight="700" text-anchor="middle">
      <text x="135" y="94">Cửa</text><text x="135" y="118">Đất</text>
      <text x="965" y="94">Cửa Con</text><text x="965" y="118">Người</text>
      <text x="135" y="664">Cửa Ma</text><text x="135" y="688">Quỷ</text>
      <text x="965" y="664">Cửa</text><text x="965" y="688">Trời</text>
    </g>
    <!-- outer square -->
    <rect x="300" y="150" width="500" height="480" fill="none" stroke="#111111" stroke-width="2"/>
    <!-- outer yin open circles: top 7, right 9, left 8; yang black dots bottom 6 -->
    <g fill="none" stroke="#111111" stroke-width="1.6">
      <g>
        <circle cx="340" cy="150" r="7"/><circle cx="390" cy="150" r="7"/><circle cx="440" cy="150" r="7"/>
        <circle cx="490" cy="150" r="7"/><circle cx="540" cy="150" r="7"/><circle cx="590" cy="150" r="7"/><circle cx="640" cy="150" r="7"/>
      </g>
      <g>
        <circle cx="300" cy="200" r="7"/><circle cx="300" cy="250" r="7"/><circle cx="300" cy="300" r="7"/><circle cx="300" cy="350" r="7"/>
        <circle cx="300" cy="400" r="7"/><circle cx="300" cy="450" r="7"/><circle cx="300" cy="500" r="7"/><circle cx="300" cy="550" r="7"/>
      </g>
      <g>
        <circle cx="800" cy="190" r="7"/><circle cx="800" cy="235" r="7"/><circle cx="800" cy="280" r="7"/><circle cx="800" cy="325" r="7"/>
        <circle cx="800" cy="370" r="7"/><circle cx="800" cy="415" r="7"/><circle cx="800" cy="460" r="7"/><circle cx="800" cy="505" r="7"/><circle cx="800" cy="550" r="7"/>
      </g>
    </g>
    <g fill="#111111">
      <circle cx="350" cy="630" r="7"/><circle cx="430" cy="630" r="7"/><circle cx="510" cy="630" r="7"/>
      <circle cx="590" cy="630" r="7"/><circle cx="670" cy="630" r="7"/><circle cx="750" cy="630" r="7"/>
    </g>
    <!-- inner square with black dots -->
    <rect x="360" y="215" width="380" height="370" fill="none" stroke="#111111" stroke-width="2"/>
    <g fill="#111111">
      <circle cx="405" cy="215" r="6"/><circle cx="470" cy="215" r="6"/><circle cx="535" cy="215" r="6"/><circle cx="600" cy="215" r="6"/><circle cx="665" cy="215" r="6"/>
      <circle cx="360" cy="270" r="6"/><circle cx="360" cy="330" r="6"/><circle cx="360" cy="390" r="6"/><circle cx="360" cy="450" r="6"/><circle cx="360" cy="510" r="6"/>
      <circle cx="740" cy="270" r="6"/><circle cx="740" cy="330" r="6"/><circle cx="740" cy="390" r="6"/><circle cx="740" cy="450" r="6"/><circle cx="740" cy="510" r="6"/>
      <circle cx="405" cy="585" r="6"/><circle cx="470" cy="585" r="6"/><circle cx="535" cy="585" r="6"/><circle cx="600" cy="585" r="6"/><circle cx="665" cy="585" r="6"/>
    </g>
    <!-- central circular arrangement -->
    <circle cx="550" cy="400" r="118" fill="none" stroke="#111111" stroke-width="1.8"/>
    <g fill="#ffffff" stroke="#111111" stroke-width="1.8">
      <circle cx="550" cy="292" r="24"/><circle cx="452" cy="400" r="24"/><circle cx="648" cy="400" r="24"/>
      <circle cx="550" cy="508" r="24"/><circle cx="550" cy="400" r="26"/>
    </g>
    <g font-size="17" font-weight="700" text-anchor="middle">
      <text x="550" y="299">(2)</text><text x="452" y="407">(3)</text><text x="648" y="407">(4)</text>
      <text x="550" y="515">(1)</text><text x="550" y="407">(5)</text>
    </g>
    <g font-size="15" text-anchor="middle">
      <text x="550" y="270">Nguyên Thần</text>
      <text x="420" y="375">Nguyên Khí</text>
      <text x="682" y="375">Nguyên Tinh</text>
      <text x="550" y="555">Nguyên Tinh</text>
      <text x="672" y="470">Nguyên Khí</text>
    </g>
    <!-- flow arrows -->
    <g stroke="#111111" stroke-width="1.3" fill="none" marker-end="url(#a45)">
      <path d="M530 305 Q465 340 462 373"/>
      <path d="M475 420 Q510 470 535 492"/>
      <path d="M570 492 Q600 465 632 420"/>
      <path d="M628 375 Q600 330 570 305"/>
    </g>
    <defs><marker id="a45" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#111111"/></marker></defs>
    <!-- direction labels -->
    <g font-size="19" font-weight="700" text-anchor="middle">
      <text x="550" y="120">Nam (Hỏa) (7)</text>
      <text x="550" y="745">Bắc (Thủy) (6)</text>
    </g>
    <g font-size="19" font-weight="700">
      <text x="245" y="402" text-anchor="end">Đông (Mộc) (8)</text>
      <text x="855" y="402">Tây (Kim) (9)</text>
    </g>
  </g>
</svg>
