<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 760" role="img" aria-labelledby="title desc">
  <title id="title">Hình 1.87. Sáu phương pháp bí truyền được dùng để tinh luyện Tam Thân của người đệ tử</title>
  <desc id="desc">Sơ đồ trung tâm "Chuyển hóa Tam Thân" dẫn tới sáu phương pháp: Ngọc Dịch, Kim Dịch, Thái Âm, Thái Dương, Nội Quán, Chân Không. Toàn bộ nhãn bằng tiếng Việt.</desc>
  <rect width="1150" height="760" fill="#ffffff"/>
  <g font-family="Be Vietnam, Noto Sans, Arial, sans-serif" fill="#111111" stroke="none">
    <rect x="40" y="320" width="300" height="110" fill="#ffffff" stroke="#111111" stroke-width="1.6"/>
    <text x="190.0" y="350" font-size="16" font-weight="700" text-anchor="middle">Chuyển hóa Tam Thân</text>
    <text x="190.0" y="371" font-size="16" font-weight="700" text-anchor="middle">Của Đệ Tử</text>
    <path d="M340 375 C440 375 440 105 540 105" fill="none" stroke="#111111" stroke-width="1.5"/>
    <rect x="540" y="60" width="580" height="90" fill="#ffffff" stroke="#111111" stroke-width="1.6"/>
    <text x="830.0" y="90" font-size="15" font-weight="700" text-anchor="middle">#1 - Ngọc Dịch</text>
    <text x="830.0" y="110" font-size="15" font-weight="700" text-anchor="middle">(Nước Bọt Được Sung Năng)</text>
    <path d="M340 375 C440 375 440 210 540 210" fill="none" stroke="#111111" stroke-width="1.5"/>
    <rect x="540" y="165" width="580" height="90" fill="#ffffff" stroke="#111111" stroke-width="1.6"/>
    <text x="830.0" y="195" font-size="15" font-weight="700" text-anchor="middle">#2 - Kim Dịch</text>
    <text x="830.0" y="215" font-size="15" font-weight="700" text-anchor="middle">(Sinh Lực Được Sung Năng Và Chuyển Hóa)</text>
    <path d="M340 375 C440 375 440 315 540 315" fill="none" stroke="#111111" stroke-width="1.5"/>
    <rect x="540" y="270" width="580" height="90" fill="#ffffff" stroke="#111111" stroke-width="1.6"/>
    <text x="830.0" y="300" font-size="15" font-weight="700" text-anchor="middle">#3 - Thái Âm</text>
    <text x="830.0" y="320" font-size="15" font-weight="700" text-anchor="middle">(Ngoại Đan Dược)</text>
    <path d="M340 375 C440 375 440 420 540 420" fill="none" stroke="#111111" stroke-width="1.5"/>
    <rect x="540" y="375" width="580" height="90" fill="#ffffff" stroke="#111111" stroke-width="1.6"/>
    <text x="830.0" y="405" font-size="15" font-weight="700" text-anchor="middle">#4 - Thái Dương</text>
    <text x="830.0" y="425" font-size="15" font-weight="700" text-anchor="middle">(Nội Đan Dược)</text>
    <path d="M340 375 C440 375 440 525 540 525" fill="none" stroke="#111111" stroke-width="1.5"/>
    <rect x="540" y="480" width="580" height="90" fill="#ffffff" stroke="#111111" stroke-width="1.6"/>
    <text x="830.0" y="510" font-size="15" font-weight="700" text-anchor="middle">#5 - Nội Quán</text>
    <text x="830.0" y="530" font-size="15" font-weight="700" text-anchor="middle">(Quán Tưởng Và Trí Tưởng Tượng)</text>
    <path d="M340 375 C440 375 440 630 540 630" fill="none" stroke="#111111" stroke-width="1.5"/>
    <rect x="540" y="585" width="580" height="90" fill="#ffffff" stroke="#111111" stroke-width="1.6"/>
    <text x="830.0" y="615" font-size="15" font-weight="700" text-anchor="middle">#6 - Chân Không</text>
    <text x="830.0" y="635" font-size="15" font-weight="700" text-anchor="middle">(Tọa Vong)</text>
  </g>
</svg>
