<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 700" role="img" aria-labelledby="title desc">
  <title id="title">Hình 1.13. Ngũ Hành (Wu Xing, tức Five Elements)</title>
  <desc id="desc">Sơ đồ Ngũ Hành gồm Hỏa, Thổ, Kim, Thủy, Mộc theo chu kỳ tương sinh và các đường tương khắc, kèm nhãn mùa. Toàn bộ nhãn bằng tiếng Việt.</desc>
  <rect width="760" height="700" fill="#ffffff"/>
  <g font-family="Be Vietnam, Noto Sans, Arial, sans-serif" fill="#111111">
    <g stroke="#111111" stroke-width="2.5" fill="none">
      <path d="M 380 150 A 200 200 0 0 1 545 245" marker-end="url(#a)"/>
      <path d="M 555 265 A 200 200 0 0 1 520 460" marker-end="url(#a)"/>
      <path d="M 490 485 A 200 200 0 0 1 270 485" marker-end="url(#a)"/>
      <path d="M 240 460 A 200 200 0 0 1 205 245" marker-end="url(#a)"/>
      <path d="M 215 225 A 200 200 0 0 1 380 150" marker-end="url(#a)"/>
      <line x1="215" y1="250" x2="545" y2="250" marker-end="url(#a)"/>
      <line x1="520" y1="185" x2="265" y2="455" marker-end="url(#a)"/>
      <line x1="255" y1="185" x2="500" y2="455" marker-end="url(#a)"/>
      <line x1="380" y1="175" x2="380" y2="470" marker-end="url(#a)"/>
      <line x1="535" y1="320" x2="230" y2="320" marker-end="url(#a)"/>
    </g>
    <defs>
      <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#111111"/>
      </marker>
    </defs>

    <text x="380" y="62" text-anchor="middle" font-size="26" font-weight="700">Hỏa (Mùa Hè)</text>
    <text x="380" y="140" text-anchor="middle" font-size="52">🔥</text>

    <text x="650" y="245" text-anchor="middle" font-size="24" font-weight="700">Thổ</text>
    <text x="650" y="275" text-anchor="middle" font-size="20">(Cuối Mùa Hè)</text>
    <text x="650" y="330" text-anchor="middle" font-size="46">◍</text>

    <text x="655" y="500" text-anchor="middle" font-size="24" font-weight="700">Kim (Mùa Thu)</text>
    <text x="655" y="560" text-anchor="middle" font-size="46">▭</text>

    <text x="380" y="650" text-anchor="middle" font-size="24" font-weight="700">Thủy (Mùa Đông)</text>
    <text x="380" y="615" text-anchor="middle" font-size="42">≈≈</text>

    <text x="105" y="500" text-anchor="middle" font-size="24" font-weight="700">Mộc (Mùa Xuân)</text>
    <text x="105" y="560" text-anchor="middle" font-size="46">🌳</text>

    <text x="380" y="690" text-anchor="middle" font-size="15" font-style="italic">Chu kỳ tương sinh (vòng ngoài) và tương khắc (sao năm cạnh)</text>
  </g>
</svg>
