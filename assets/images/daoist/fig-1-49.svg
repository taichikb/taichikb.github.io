<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 820" role="img" aria-labelledby="title desc">
  <title id="title">Hình 1.49. Chu Kỳ Khắc Chế "Âm" của Ngũ Hành, theo thiết kế của Đồ Hình Lạc Hà</title>
  <desc id="desc">Đồ Hình Lạc Hà: vòng tròn lớn với bốn cổng, bốn hình thoi ở góc, và hai vòng tròn nhỏ hơn biểu diễn Chu Kỳ của Trời và Chu Kỳ của Đất xung quanh tâm Đất. Toàn bộ nhãn bằng tiếng Việt.</desc>
  <rect width="1000" height="820" fill="#ffffff"/>
  <g font-family="Be Vietnam, Noto Sans, Arial, sans-serif" fill="#111111" stroke="none">
    <!-- four doors -->
    <g stroke="#111111" stroke-width="1.6" fill="#ffffff">
      <rect x="40" y="130" width="150" height="58"/>
      <rect x="810" y="130" width="150" height="58"/>
      <rect x="40" y="640" width="150" height="58"/>
      <rect x="810" y="640" width="150" height="58"/>
    </g>
    <g font-size="18" font-weight="700" text-anchor="middle">
      <text x="115" y="153">Cửa</text><text x="115" y="177">Đất</text>
      <text x="885" y="153">Cửa Con</text><text x="885" y="177">Người</text>
      <text x="115" y="663">Cửa Ma</text><text x="115" y="687">Quỷ</text>
      <text x="885" y="663">Cửa</text><text x="885" y="687">Trời</text>
    </g>
    <!-- outer circle -->
    <circle cx="500" cy="410" r="290" fill="none" stroke="#111111" stroke-width="2.2"/>
    <!-- outer cycle arrows -->
    <g stroke="#111111" stroke-width="1.8" fill="none" marker-end="url(#a49)">
      <path d="M300 190 Q265 230 250 280"/>
      <path d="M250 540 Q270 600 320 640"/>
      <path d="M700 640 Q750 600 770 540"/>
      <path d="M770 280 Q750 220 700 180"/>
    </g>
    <defs><marker id="a49" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#111111"/></marker></defs>
    <!-- four corner diamonds -->
    <g fill="none" stroke="#111111" stroke-width="2.2">
      <rect x="315" y="240" width="62" height="62" transform="rotate(45 346 271)"/>
      <rect x="623" y="240" width="62" height="62" transform="rotate(45 654 271)"/>
      <rect x="315" y="520" width="62" height="62" transform="rotate(45 346 551)"/>
      <rect x="623" y="520" width="62" height="62" transform="rotate(45 654 551)"/>
    </g>
    <!-- top row of small circles -->
    <g fill="none" stroke="#111111" stroke-width="1.5">
      <circle cx="405" cy="285" r="5"/><circle cx="425" cy="285" r="5"/><circle cx="445" cy="285" r="5"/>
      <circle cx="465" cy="285" r="5"/><circle cx="485" cy="285" r="5"/><circle cx="505" cy="285" r="5"/>
      <circle cx="525" cy="285" r="5"/><circle cx="545" cy="285" r="5"/><circle cx="565" cy="285" r="5"/>
      <circle cx="585" cy="285" r="5"/><circle cx="605" cy="285" r="5"/>
    </g>
    <!-- left vertical line with circles -->
    <line x1="320" y1="330" x2="320" y2="500" stroke="#111111" stroke-width="1.8"/>
    <g fill="#ffffff" stroke="#111111" stroke-width="1.6">
      <circle cx="320" cy="345" r="7"/><circle cx="320" cy="385" r="7"/><circle cx="320" cy="425" r="7"/>
      <circle cx="320" cy="465" r="7"/><circle cx="320" cy="495" r="7"/>
    </g>
    <!-- right vertical line with circles -->
    <line x1="680" y1="330" x2="680" y2="500" stroke="#111111" stroke-width="1.8"/>
    <g fill="#ffffff" stroke="#111111" stroke-width="1.6">
      <circle cx="680" cy="340" r="7"/><circle cx="680" cy="365" r="7"/><circle cx="680" cy="390" r="7"/>
      <circle cx="680" cy="415" r="7"/><circle cx="680" cy="440" r="7"/><circle cx="680" cy="465" r="7"/><circle cx="680" cy="490" r="7"/>
    </g>
    <!-- inner circle -->
    <circle cx="500" cy="410" r="155" fill="none" stroke="#111111" stroke-width="2"/>
    <!-- Earth cross at center -->
    <g stroke="#111111" stroke-width="1.8" fill="none">
      <circle cx="500" cy="410" r="75"/>
      <line x1="500" y1="335" x2="500" y2="485"/><line x1="425" y1="410" x2="575" y2="410"/>
    </g>
    <g fill="#ffffff" stroke="#111111" stroke-width="1.6">
      <circle cx="500" cy="335" r="7"/><circle cx="425" cy="410" r="7"/><circle cx="575" cy="410" r="7"/><circle cx="500" cy="485" r="7"/>
    </g>
    <text x="500" y="400" font-size="20" font-weight="700" text-anchor="middle">Đất</text>
    <text x="500" y="425" font-size="16" text-anchor="middle">(Trung tâm)</text>
    <!-- labels -->
    <g font-size="19" font-weight="700">
      <text x="800" y="300">Chu Kỳ</text><text x="800" y="325">của Đất</text>
      <text x="440" y="610">Chu Kỳ của Trời</text>
    </g>
  </g>
</svg>
