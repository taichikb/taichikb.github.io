<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" role="img" aria-labelledby="title desc">
  <title id="title">Hình 1.78. Người đệ tử đứng thiền, hướng mặt về phía Mặt Trời, với lưng được đặt trong bóng râm mát mẻ của một ngọn núi hay bóng của một cái cây</title>
